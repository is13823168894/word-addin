        console.log('原始数据:', data2d);
        console.log('每行长度:', data2d.map(function(r) { return r.length; }));

        var headerRowsEl = document.getElementById('npOptHeaderRows');
        var headerRowCount = headerRowsEl ? parseInt(headerRowsEl.value) : 1;
        if (isNaN(headerRowCount) || headerRowCount < 0) headerRowCount = 1;

        // 从数据行推断实际列数（因为合并表头的行长度可能不同）
        // 优先看数据行（非表头行）的长度
        var colCount = 0;
        if (data2d.length > headerRowCount) {
            // 取数据行中最长的
            for (var r = headerRowCount; r < data2d.length; r++) {
                if (data2d[r].length > colCount) colCount = data2d[r].length;
            }
        }
        // 如果没有数据行或数据行长度为0，取最长的行
        if (colCount === 0) {
            for (var r2 = 0; r2 < data2d.length; r2++) {
                if (data2d[r2].length > colCount) colCount = data2d[r2].length;
            }
        }

        console.log('推断列数:', colCount);

        // 智能补全短行（处理合并表头的 colspan）
        for (var r3 = 0; r3 < data2d.length; r3++) {
            if (data2d[r3].length < colCount) {
                var shortRow = data2d[r3];

                // 尝试从下一行（表头行或数据行）推断 colspan
                // 检测下一行的重复模式来确定每个单元格跨几列
                var spans = null;
                if (r3 + 1 < data2d.length) {
                    var nextRow = data2d[r3 + 1];
                    // 找到下一行中的重复模式长度
                    var patternLen = findPatternLength(nextRow, shortRow.length);
                    if (patternLen > 1) {
                        // 按 patternLen 分割 shortRow，除第一个元素外，每个元素跨 patternLen 列
                        spans = [];
                        spans.push(1); // 第一个元素（项目列）通常跨1列
                        for (var si = 1; si < shortRow.length; si++) {
                            spans.push(patternLen);
                        }
                    }
                }

                if (spans) {
                    // 按 span 扩展
                    var expanded = [];
                    for (var ei = 0; ei < shortRow.length; ei++) {
                        var val = shortRow[ei];
                        var span = spans[ei] || 1;
                        for (var es = 0; es < span; es++) {
                            expanded.push(val);
                        }
                    }
                    // 如果还不够，用最后一个值填充
                    while (expanded.length < colCount) {
                        expanded.push(shortRow[shortRow.length - 1]);
                    }
                    data2d[r3] = expanded;
                } else {
                    // 简单填充：复制最后一个值
                    var lastVal = shortRow[shortRow.length - 1];
                    while (shortRow.length < colCount) {
                        shortRow.push(lastVal);
                    }
                }
            }
        }

        console.log('补全后数据:', data2d);

        // 存储原始文本（用于显示行标签）和解析后的数字（用于计算）
        var npData = { headers: [], dataRows: [], textRows: [], totals: null };

        // 无表头情况
        if (headerRowCount === 0) {
            var headers = [];
            for (var c = 0; c < colCount; c++) {
                headers.push('列' + (c + 1));
            }

            var dataRows = [];
            var textRows = [];
            for (var r = 0; r < data2d.length; r++) {
                var row = [];
                var textRow = [];
                for (var c = 0; c < colCount; c++) {
                    var cellVal = data2d[r][c];
                    textRow.push(cellVal !== null && cellVal !== undefined ? String(cellVal) : '');
                    var val = null;
                    if (cellVal !== null && cellVal !== undefined && String(cellVal).trim() !== '') {
                        val = parseNumber(String(cellVal));
                    }
                    row.push(val);
                }
                dataRows.push(row);
                textRows.push(textRow);
            }

            npData.headers = headers;
            npData.dataRows = dataRows;
            npData.textRows = textRows;

            var textLines = [headers.join('\t')];
            for (var r2 = 0; r2 < data2d.length; r2++) {
                textLines.push(data2d[r2].map(function(v) { return v !== null && v !== undefined ? String(v) : ''; }).join('\t'));
            }
            npInput.value = textLines.join('\n');

            if (statusEl) {
                statusEl.style.color = '#1a7f37';
                statusEl.textContent = '已导入: ' + sourceDesc + ' ' + data2d.length + ' 行 × ' + colCount + ' 列（无表头）';
            }
        } else {
            // 有表头情况
            var headers = [];
            if (headerRowCount <= 1) {
                headers = data2d[0].map(function(s, ci) {
                    var val = String(s).trim();
                    return val || ('列' + (ci + 1));
                });
            } else {
                for (var c = 0; c < colCount; c++) {
                    var combined = '';
                    for (var hr = 0; hr < Math.min(headerRowCount, data2d.length); hr++) {
                        var cellVal = String(data2d[hr][c] || '').trim();
                        if (cellVal) {
                            if (combined) combined += '+';
                            combined += cellVal;
                        }
                    }
                    headers.push(combined || ('列' + (c + 1)));
                }
            }

            var dataRows = [];
            var textRows = [];
            for (var r = headerRowCount; r < data2d.length; r++) {
                var row = [];
                var textRow = [];
                for (var c = 0; c < colCount; c++) {
                    var cellVal = data2d[r][c];
                    textRow.push(cellVal !== null && cellVal !== undefined ? String(cellVal) : '');
                    var val = null;
                    if (cellVal !== null && cellVal !== undefined && String(cellVal).trim() !== '') {
                        val = parseNumber(String(cellVal));
                    }
                    row.push(val);
                }
                dataRows.push(row);
                textRows.push(textRow);
            }

            npData.headers = headers;
            npData.dataRows = dataRows;
            npData.textRows = textRows;

            var textLines = [headers.join('\t')];
            // 只写入数据行（跳过表头行），避免表头行被重复写进输入文本
            for (var r2 = headerRowCount; r2 < data2d.length; r2++) {
                textLines.push(data2d[r2].map(function(v) { return v !== null && v !== undefined ? String(v) : ''; }).join('\t'));
            }
            npInput.value = textLines.join('\n');

            if (statusEl) {
                statusEl.style.color = '#1a7f37';
                statusEl.textContent = '已导入: ' + sourceDesc + ' ' + data2d.length + ' 行 × ' + colCount + ' 列（表头' + headerRowCount + '行，数据' + dataRows.length + '行）';
            }
        }

        npImportedData = npData;
        console.log('最终导入数据:', npImportedData);

        // 导入完成后立即持久化，确保刷新/重开面板后恢复的是新表格文本而不是旧状态
        try { npSaveState(); } catch (e3) {
            if (typeof console !== 'undefined') console.warn('[npState] 导入后立即保存失败:', e3 && e3.message);
        }
        // 后续渲染/计算失败不应影响已写入输入框的表格文本，仅记录警告
        try { npRenderOptions(); } catch (renderErr) {
            if (typeof console !== 'undefined') console.warn('[npState] 导入后渲染选项失败:', renderErr && renderErr.message);
        }
        try { npCalculate(); } catch (calcErr) {
            if (typeof console !== 'undefined') console.warn('[npState] 导入后计算失败:', calcErr && calcErr.message);
        }
        // 渲染重建了选项区，原 statusEl 已脱离 DOM，重新把导入结果提示写进去，避免看不到成功/失败
        var freshStatus = document.getElementById('npImportStatus');
        if (freshStatus) {
            freshStatus.style.color = '#1a7f37';
            freshStatus.textContent = '已导入: ' + sourceDesc + ' ' + data2d.length + ' 行 × ' + colCount + ' 列（表头' + headerRowCount + '行，数据' + dataRows.length + '行）';
        }
    }

    // ========== 状态持久化（刷新后恢复数据和结果） ==========
    // 只使用 localStorage，与 compare 等其他加载项一致，简单可靠。
    var NP_STATE_KEY = 'digitalpanel_state_v2';
    var npSavedState = null;

    function npStorageSave(jsonStr) {
        try {
            localStorage.setItem(NP_STATE_KEY, jsonStr);
            if (typeof console !== 'undefined') console.log('[npState] saved via localStorage (' + jsonStr.length + ' chars)');
            return true;
        } catch (e) {
            if (typeof console !== 'undefined') console.error('[npState] localStorage save FAILED:', e && e.message);
            return false;
        }
    }

    function npStorageLoad() {
        try {
            var raw = localStorage.getItem(NP_STATE_KEY);
            if (raw) {
                if (typeof console !== 'undefined') console.log('[npState] loaded via localStorage (' + raw.length + ' chars)');
                return raw;
            }
        } catch (e) {
            if (typeof console !== 'undefined') console.error('[npState] localStorage load FAILED:', e && e.message);
        }
        if (typeof console !== 'undefined') console.warn('[npState] NO saved state found -> 面板将为空');
        return null;
    }

    function npSaveState() {
        try {
            var sumCols = [];
            var sumChecks = document.querySelectorAll('.np-sum-col:checked');
            for (var i = 0; i < sumChecks.length; i++) {
                sumCols.push(parseInt(sumChecks[i].dataset.col));
            }
            var hEl = document.getElementById('npOptHasTotal');
            var hrEl = document.getElementById('npOptHeaderRows');
            var pcEl = document.getElementById('npPctCol');
            var psEl = document.getElementById('npPctSrcCol');
            var pdEl = document.getElementById('npPctDenom');
            var pvEl = document.getElementById('npPctDenomVal');

            var stateObj = {
                mode: npCurrentMode,
                input: npInput ? npInput.value : '',
                imported: npImportedData,
                rowConfig: npRowConfig,
                subStart: npSubStartConfig,
                rowCoeff: npRowCoeff,
                rowCompare: npRowCompare,
                rowPct100: npRowPct100,
                customOps: npCustomOps,
                hasTotal: hEl ? hEl.checked : true,
                headerRows: hrEl ? (parseInt(hrEl.value) || 1) : 1,
                sumCols: sumCols,
                pctCol: pcEl ? pcEl.value : '',
                pctSrcCol: psEl ? psEl.value : '',
                pctDenom: pdEl ? pdEl.value : 'sum',
                pctDenomVal: pvEl ? pvEl.value : '',
                pctGroups: []
            };
            var pctGroupArr = [];
            var grpContainer2 = document.getElementById('npPctGroups');
            if (grpContainer2) {
                // 每个新增组是一个顶层 div（含标题 + 配置行 + 可选删除按钮）
                var grpDivs2 = grpContainer2.children;
                for (var gd2 = 0; gd2 < grpDivs2.length; gd2++) {
                    var grpSelects2 = grpDivs2[gd2].querySelectorAll('select');
                    if (grpSelects2.length >= 3) {
                        var gColV = grpSelects2[0].value;
                        var gSrcV = grpSelects2[1].value;
                        var gDenomV = grpSelects2[2].value;
                        var gValEl2 = grpDivs2[gd2].querySelector('input[type="number"]');
                        if (gColV !== '' && gColV !== '-- 选择 --' && gSrcV !== '' && gSrcV !== '-- 选择 --') {
                            pctGroupArr.push({
                                pctCol: gColV,
                                pctSrcCol: gSrcV,
                                pctDenom: gDenomV || 'sum',
                                pctDenomVal: gValEl2 ? gValEl2.value : ''
                            });
                        }
                    }
                }
            }
            stateObj.pctGroups = pctGroupArr;

            // 只写入 localStorage（单一通道，无时间戳/精简态复杂度）
            npStorageSave(JSON.stringify(stateObj));
            // 同步内存快照，保证后续重渲染（输入防抖、切换选项等）恢复的是最新勾选
            npSavedState = stateObj;
        } catch (e) {
            if (typeof console !== 'undefined') console.error('[npState] npSaveState 出错（状态未保存）:', e && e.message);
        }
    }

    function npLoadState() {
        var raw = npStorageLoad();
        if (!raw) return null;
        try {
            return JSON.parse(raw);
        } catch (e) {
            return null;
        }
    }

    function npInit() {
        npInput = document.getElementById('npInput');
        npResult = document.getElementById('npResult');
        npResultContent = document.getElementById('npResultContent');
        npResultTitle = document.getElementById('npResultTitle');
        npModesEl = document.getElementById('npModes');
        npOptionsEl = document.getElementById('npOptions');

        // 恢复上次会话状态（刷新后保留数据和结果）
        var savedState = npLoadState();
        if (savedState) {
            if (savedState.mode && npModes[savedState.mode]) npCurrentMode = savedState.mode;
            if (typeof savedState.input === 'string') npInput.value = savedState.input;
            if (savedState.imported) npImportedData = savedState.imported;
            if (savedState.rowConfig) npRowConfig = savedState.rowConfig;
            if (savedState.subStart) npSubStartConfig = savedState.subStart;
            if (savedState.rowCoeff) npRowCoeff = savedState.rowCoeff;
            if (savedState.rowCompare) npRowCompare = savedState.rowCompare;
            if (savedState.rowPct100) npRowPct100 = savedState.rowPct100;
            if (savedState.customOps) npCustomOps = savedState.customOps;
            npSavedState = savedState;
            var subCnt = 0;
            if (npSubStartConfig) {
                for (var sci = 0; sci < npSubStartConfig.length; sci++) {
                    if (npSubStartConfig[sci]) subCnt++;
                }
            }
            if (typeof console !== 'undefined') console.log('[npState] restored: mode=' + npCurrentMode + ', rows=' + (npRowConfig ? npRowConfig.length : 0) + ', subStart=' + subCnt + ', imported=' + (npImportedData ? 'yes' : 'no'));
        }

        var html = '';
        for (var id in npModes) {
            html += '<button class="np-mode-btn' + (id === npCurrentMode ? ' active' : '') +
                '" data-mode="' + id + '">' + npModes[id].name + '</button>';
        }
        npModesEl.innerHTML = html;

        npModesEl.addEventListener('click', function(e) {
            var btn = e.target.closest('.np-mode-btn');
            if (!btn) return;
            npCurrentMode = btn.dataset.mode;
            var btns = npModesEl.querySelectorAll('.np-mode-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.toggle('active', btns[i].dataset.mode === npCurrentMode);
            }
            npInput.placeholder = npGetPlaceholder(npCurrentMode);
            npRenderOptions();
            npCalculate();
        });

        // 选项区监听器只在启动时注册一次，避免每次 npRenderOptions 重绘后重复累加，
        // 导致点一次「从Word导入」触发多次 Word.run 并发、显示错乱回退旧表。
        npOptionsEl.addEventListener('click', function(e) {
            if (e.target.id === 'npBtnImport') {
                npImportedData = null;
                npImportWordTable();
            }
        });

        npOptionsEl.addEventListener('change', function(e) {
            if (e.target.id === 'npOptHasTotal') {
                npImportedData = null;
                var mode = npModes[npCurrentMode];
                if (mode.updateOptions) mode.updateOptions(npInput.value);
                npCalculate();
            } else if (e.target.id === 'npOptHeaderRows') {
                npImportedData = null;
                var mode2 = npModes[npCurrentMode];
                if (mode2.updateOptions) mode2.updateOptions(npInput.value);
                npCalculate();
            } else if (e.target.classList.contains('np-row-radio')) {
                var rowIdx = parseInt(e.target.dataset.row);
                if (!isNaN(rowIdx)) {
                    npRowConfig[rowIdx] = e.target.value;
                }
                npCalculate();
            } else if (e.target.classList.contains('np-sum-col')) {
                npCalculate();
            } else if (e.target.id === 'npPctDenom') {
                var val = e.target.value;
                var customInput = document.getElementById('npPctDenomVal');
                if (customInput) {
                    customInput.style.display = (val === 'custom') ? 'inline-block' : 'none';
                }
                npCalculate();
            } else if (e.target.id === 'npPctCol' || e.target.id === 'npPctSrcCol' || e.target.id === 'npPctDenomVal') {
                npCalculate();
            }
        });

        npInput.addEventListener('input', function() {
            clearTimeout(npDebounceTimer);
            npDebounceTimer = setTimeout(function() {
                npRenderOptions();
                npCalculate();
            }, 200);
        });

        npInput.addEventListener('paste', function(e) {
            var html = null;
            if (e && e.clipboardData) {
                html = e.clipboardData.getData('text/html');
            }
            if (html && /<table[\s>]/i.test(html)) {
                e.preventDefault();
                var parsed = parseHtmlTable(html);
                if (parsed && parsed.headers && parsed.headers.length >= 2) {
                    var textLines = [parsed.headers.join('\t')];
                    // 用原始文本(textRows)而不是数值化结果(dataRows)拼输入文本，
                    // 否则非数字的第一列名称会被解析成 null 而在写入时丢失（刷新后首列变"第N行"）
                    for (var r = 0; r < parsed.dataRows.length; r++) {
                        var srcRow = (parsed.textRows && parsed.textRows[r]) ? parsed.textRows[r] : parsed.dataRows[r];
                        textLines.push(srcRow.map(function(v) { return v !== null && v !== undefined ? String(v) : ''; }).join('\t'));
                    }
                    npInput.value = textLines.join('\n');
                    npImportedData = parsed;
                    var statusEl = document.getElementById('npImportStatus');
                    if (statusEl) {
                        statusEl.style.color = '#1a7f37';
                        statusEl.textContent = '已解析HTML表格: ' + parsed.dataRows.length + ' 行 × ' + parsed.headers.length + ' 列';
                    }
                    npRenderOptions();
                    npCalculate();
                    return;
                }
            }
            setTimeout(function() {
                npImportedData = null;
                npRenderOptions();
                npCalculate();
            }, 0);
        });

        npInput.placeholder = npGetPlaceholder(npCurrentMode);
        npRenderOptions();
        npCalculate();
    }

    function npGetPlaceholder(modeId) {
        if (modeId === 'table-verify') {
            return '方式1: 点击「从Word导入」直接读取光标所在表格\n方式2: 粘贴表格数据（制表符/空格分隔）';
        }
        return '粘贴数字，每行一个，例如：\n8,135.55\n10,988.98\n12,674.42';
    }

    function npRenderOptions() {
        var mode = npModes[npCurrentMode];
        if (mode.options) {
            // 保存当前用户设置的值（优先取当前DOM，其次取上次会话恢复的状态）
            var existingHeaderRowsEl = document.getElementById('npOptHeaderRows');
            var savedHeaderRows = existingHeaderRowsEl ? (parseInt(existingHeaderRowsEl.value) || 1) : (npSavedState && npSavedState.headerRows ? npSavedState.headerRows : 1);
            var existingHasTotalEl = document.getElementById('npOptHasTotal');
            var savedHasTotal = existingHasTotalEl ? existingHasTotalEl.checked : (npSavedState ? (npSavedState.hasTotal !== undefined ? npSavedState.hasTotal : true) : true);

            npOptionsEl.innerHTML = mode.options();

            // 恢复用户设置的值
            var newHeaderRowsEl = document.getElementById('npOptHeaderRows');
            if (newHeaderRowsEl) {
                newHeaderRowsEl.value = savedHeaderRows;
            }
            var newHasTotalEl = document.getElementById('npOptHasTotal');
            if (newHasTotalEl) {
                newHasTotalEl.checked = savedHasTotal;
            }

            npOptionsEl.style.display = 'block';
            if (mode.updateOptions) mode.updateOptions(npInput.value);

            // 恢复保存的新增列验证组（刷新后保留按钮组）
            try {
                var savedGroups = npSavedState && npSavedState.pctGroups ? npSavedState.pctGroups : [];
                // 用当前输入解析表头（避免引用未定义的 parsed 变量导致崩溃）
                var grpHeaders = [];
                try {
                    var grpParsedTmp = npImportedData || parseTable(npInput ? npInput.value : '');
                    if (grpParsedTmp && grpParsedTmp.headers) grpHeaders = grpParsedTmp.headers;
                } catch (e2) { grpHeaders = []; }
                for (var sg = 0; sg < savedGroups.length; sg++) {
                    var grpItem = savedGroups[sg];
                    if (!grpItem || grpItem.pctCol === undefined) continue;
                    var grpDiv = document.createElement('div');
                    grpDiv.style.cssText = 'margin-top:6px;padding-top:6px;border-top:1px dashed #aaa;background:#f8f9fa;border-radius:3px;padding:6px;';
                    grpDiv.innerHTML = '<div style="font-size:12px;font-weight:bold;color:#2b579a;margin-bottom:4px;">新增列验证组 · 组' + (sg + 1) + '</div>' +
                        '<div style="font-size:11px;color:#555;">比例列: <select id="npPctCol_' + (sg + 1) + '"><option value="">-- 选择 --</option></select> ' +
                        '源数值列: <select id="npPctSrcCol_' + (sg + 1) + '"><option value="">-- 选择 --</option></select> ' +
                        '分母: <select id="npPctDenom_' + (sg + 1) + '"><option value="sum">源列合计</option><option value="last">源列最后</option><option value="custom">自定义</option></select> ' +
                        '<input type="number" id="npPctDenomVal_' + (sg + 1) + '" placeholder="值" style="width:70px;font-size:11px;padding:1px 2px;border:1px solid #ccc;border-radius:2px;display:none;margin-left:2px;" value=""></div>';
                    var grpArea = document.getElementById('npPctGroups');
                    if (grpArea) grpArea.appendChild(grpDiv); else pctConfig.appendChild(grpDiv);
                    // 填充选项（使用安全解析的表头）
                    var grpColEl = document.getElementById('npPctCol_' + (sg + 1));
                    var grpSrcEl = document.getElementById('npPctSrcCol_' + (sg + 1));
                    if (grpColEl && grpHeaders.length) {
                        for (var cg = 0; cg < grpHeaders.length; cg++) grpColEl.innerHTML += '<option value="' + cg + '">' + (grpHeaders[cg] || ('列'+(cg+1))) + '</option>';
                        grpColEl.value = grpItem.pctCol || '';
                    }
                    if (grpSrcEl && grpHeaders.length) {
                        for (var sg2 = 0; sg2 < grpHeaders.length; sg2++) grpSrcEl.innerHTML += '<option value="' + sg2 + '">' + (grpHeaders[sg2] || ('列'+(sg2+1))) + '</option>';
                        grpSrcEl.value = grpItem.pctSrcCol || grpItem.pctCol || '';
                    }
                    var grpDenomEl = document.getElementById('npPctDenom_' + (sg + 1));
                    if (grpDenomEl && grpItem.pctDenom) grpDenomEl.value = grpItem.pctDenom;
                    var grpValEl = document.getElementById('npPctDenomVal_' + (sg + 1));
                    if (grpValEl && grpItem.pctDenomVal) grpValEl.value = grpItem.pctDenomVal;
                    // 绑定计算触发
                    var grpSelects = grpDiv.querySelectorAll('select');
                    for (var gsi = 0; gsi < grpSelects.length; gsi++) {
                        grpSelects[gsi].addEventListener('change', function() { npCalculate(); });
                    }
                }
            } catch (grpErr) {
                if (typeof console !== 'undefined') console.warn('[npState] 恢复列验证组失败:', grpErr && grpErr.message);
            }
        } else {
            npOptionsEl.style.display = 'none';
            npOptionsEl.innerHTML = '';
        }
    }

    function npCalculate() {
        npSaveState();
        var text = npInput.value;
        if (!text || !text.trim()) { npResult.style.display = 'none'; return; }

        var mode = npModes[npCurrentMode];
        var parsed, result;

        if (mode.parseInput) {
            parsed = mode.parseInput(text);
            result = mode.calculate(parsed);
        } else {
            parsed = parseAllNumbers(text);
            if (parsed.numbers.length < mode.minInputs) {
                npResult.style.display = 'block';
                npResultTitle.textContent = mode.name;
                var msg = '请输入至少 ' + mode.minInputs + ' 个数字';
                if (parsed.numbers.length > 0) msg += '（已识别 ' + parsed.numbers.length + ' 个）';
                if (parsed.errors.length > 0) msg += '<br><span style="color:#cf222e;">' + parsed.errors.join('<br>') + '</span>';
                npResultContent.innerHTML = '<div class="np-error">' + msg + '</div>';
                return;
            }
            result = mode.calculate(parsed.numbers);
        }

        try {
            var countLabel = '';
            if (mode.parseInput) {
                if (result.summary) countLabel = ' （' + result.summary.total + ' 项验证）';
            } else {
                countLabel = ' （' + parsed.numbers.length + ' 个数值）';
            }
            npResultTitle.textContent = mode.name + countLabel;
            npResultContent.innerHTML = mode.render(result);
            if (parsed && parsed.errors && parsed.errors.length > 0) {
                npResultContent += '<div style="margin-top:6px;font-size:11px;color:#cf222e;">' +
                    parsed.errors.join('; ') + '</div>';
            }
            npResult.style.display = 'block';
        } catch (e) {
            npResultContent.innerHTML = '<div class="np-error">计算错误: ' + e.message + '</div>';
            npResult.style.display = 'block';
        }
    }

    Office.onReady(function(info) {
        npInit();
        if (typeof console !== 'undefined') {
            console.log('[数字面板] 已启动（v3-纯localStorage版·带日志）。若此处日志出现则说明已加载最新代码，否则是任务窗格缓存了旧页面。');
        }
        var verEl = document.createElement('div');
        verEl.style.cssText = 'font-size:10px;color:#bbb;margin-top:4px;';
        verEl.textContent = 'v3 · 纯localStorage版·带日志';
        document.body.appendChild(verEl);
    });
    </script>
