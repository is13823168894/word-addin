<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>数字面板</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; padding: 10px; margin: 0; }
        textarea { font-family: Consolas, monospace; font-size: 13px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        button { padding: 8px 16px; margin-right: 6px; cursor: pointer; border-radius: 4px; border: none; font-size: 12px; }

        .np-title { font-size: 14px; font-weight: bold; color: #2b579a; margin-bottom: 8px; }
        .np-modes { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .np-mode-btn {
            padding: 5px 12px; font-size: 12px; border: 1px solid #ccc; background: white;
            border-radius: 14px; cursor: pointer; transition: all 0.2s;
        }
        .np-mode-btn:hover { border-color: #2b579a; color: #2b579a; }
        .np-mode-btn.active { background: #2b579a; color: white; border-color: #2b579a; }
        .np-input {
            width: 100%; box-sizing: border-box; min-height: 100px;
            font-family: Consolas, monospace; font-size: 13px; padding: 8px;
            border: 1px solid #ccc; border-radius: 4px; resize: vertical;
        }
        .np-input:focus { border-color: #2b579a; outline: none; }
        .np-result {
            margin-top: 10px; padding: 10px; background: #f8f9fa;
            border-left: 3px solid #2b579a; border-radius: 2px;
            min-height: 200px; max-height: 400px; overflow-y: auto;
        }
        .np-result-title { font-size: 12px; font-weight: bold; color: #333; margin-bottom: 6px; position: sticky; top: 0; background: #f8f9fa; }
        .np-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .np-table th {
            background: #eef2f7; padding: 6px 8px; text-align: left;
            font-weight: 600; color: #555; border-bottom: 2px solid #d0d7de;
            word-break: break-all; overflow-wrap: break-word; white-space: normal;
        }
        .np-table td {
            padding: 5px 8px; border-bottom: 1px solid #eaecef; color: #333;
            word-break: break-all; overflow-wrap: break-word; white-space: normal;
            /* 确保单元格能根据内容宽度自动调整，防止内容被强制压缩 */
            min-width: 0;
        }
        .np-table tr:hover td { background: #f1f3f5; }
        .np-num { font-family: Consolas, monospace; text-align: right; }
        .np-diff-pos { color: #1a7f37; }
        .np-diff-neg { color: #cf222e; }
        .np-diff-zero { color: #888; }
        .np-pct { font-weight: 600; }
        .np-empty { color: #999; font-size: 12px; text-align: center; padding: 12px; }
        .np-error { color: #cf222e; font-size: 12px; padding: 6px; background: #fff6f6; border-radius: 3px; }

        /* 表格验证选项 */
        .np-options { margin-bottom: 8px; padding: 8px; background: #f0f4f8; border-radius: 4px; font-size: 12px; }
        .np-options label { display: block; margin: 3px 0; cursor: pointer; }
        .np-options .col-checks { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; }
        .np-options .col-checks label { display: inline-flex; align-items: center; gap: 3px; margin: 0; font-size: 11px; }
        .np-verify-pass { color: #1a7f37; }
        .np-verify-fail { color: #cf222e; }
        .np-verify-warn { color: #d4a72c; }
        .np-verify-row { display: flex; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 12px; border-radius: 2px; }
        .np-verify-row:nth-child(odd) { background: #f8fbff; }
        .np-verify-row:nth-child(even) { background: #fff; }
        .np-verify-row:last-child { border-bottom: none; }
        .np-verify-label { color: #1a5276; font-weight: 600; }
        .np-verify-detail { font-family: Consolas, monospace; color: #333; word-break: break-all; white-space: normal; }
        .np-verify-value { color: #c0392b; font-weight: 500; }
        .np-verify-formula { color: #27ae60; font-size: 11px; font-family: Consolas, monospace; }
        .np-verify-diff { font-weight: 600; }
        .np-summary { margin-top: 8px; padding: 6px 8px; background: #eef2f7; border-radius: 3px; font-size: 12px; }
        .np-badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: 4px; }
        .np-badge-ok { background: #d4edda; color: #1a7f37; }
        .np-badge-fail { background: #f8d7da; color: #cf222e; }
        .np-badge-warn { background: #fff3cd; color: #d4a72c; }
    </style>
</head>
<body>
    <div class="np-title">数字面板</div>
    <div class="np-modes" id="npModes"></div>
    <div class="np-options" id="npOptions" style="display:none;"></div>
    <textarea id="npInput" class="np-input" placeholder="粘贴数字，每行一个，例如：&#10;8,135.55&#10;10,988.98&#10;12,674.42"></textarea>
    <div class="np-result" id="npResult" style="display:none;">
        <div class="np-result-title" id="npResultTitle">计算结果</div>
        <div id="npResultContent"></div>
    </div>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script>
    // ========== 数字解析器 ==========
    function parseNumber(str) {
        if (!str) return null;
        var s = String(str).trim();
        if (!s) return null;
        var negative = false;
        if (/^\(.*\)$/.test(s)) { negative = true; s = s.slice(1, -1); }
        s = s.replace(/,/g, '').replace(/\s/g, '').replace(/\u3001/g, '');
        var isPercent = false;
        if (/%$/.test(s)) { isPercent = true; s = s.replace(/%$/, ''); }
        var num = parseFloat(s);
        if (isNaN(num)) return null;
        if (negative) num = -num;
        if (isPercent) num = num / 100;
        return num;
    }

    function parseAllNumbers(text) {
        var lines = text.split(/[\n\r]+/);
        var results = [];
        var errors = [];
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            var parts = line.split(/[\t\uFF0C]+/);
            if (parts.length === 1) {
                var n = parseNumber(line);
                if (n !== null) results.push(n);
                else errors.push('第 ' + (results.length + errors.length + 1) + '行无法解析: ' + line);
            } else {
                for (var j = 0; j < parts.length; j++) {
                    var p = parseNumber(parts[j]);
                    if (p !== null) results.push(p);
                    else errors.push('"' + parts[j] + '"无法解析');
                }
            }
        }
        return { numbers: results, errors: errors };
    }

    function formatNumber(num, decimals) {
        if (num === null || num === undefined || isNaN(num)) return '--';
        if (decimals === undefined) decimals = Math.abs(num) >= 1 ? 2 : 4;
        return num.toLocaleString('en-US', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
    }

    function formatPercent(num) {
        if (num === null || num === undefined || isNaN(num)) return '--';
        return (num > 0 ? '+' : '') + num.toFixed(2) + '%';
    }

    function diffClass(val) {
        if (val === null || val === undefined) return 'np-diff-zero';
        if (val > 0) return 'np-diff-pos';
        if (val < 0) return 'np-diff-neg';
        return 'np-diff-zero';
    }

    // ========== 计算模式注册表 ==========
    var npModes = {};
    var npCurrentMode = 'diff-yoy';

    function registerMode(id, config) { npModes[id] = config; }

    registerMode('diff-yoy', {
        name: 'N-1 / N-2 对比',
        minInputs: 2,

        calculate: function(numbers) {
            var rows = [];
            for (var i = 0; i < numbers.length; i++) {
                var row = { index: i + 1, value: numbers[i] };
                if (i >= 1) {
                    var prev = numbers[i - 1];
                    var curr = numbers[i];
                    row.diffN1 = curr - prev;
                    row.pctN1 = prev !== 0 ? ((curr - prev) / Math.abs(prev)) * 100 : null;
                }
                if (i >= 2) {
                    var prev2 = numbers[i - 2];
                    var curr2 = numbers[i];
                    row.diffN2 = curr2 - prev2;
                    row.pctN2 = prev2 !== 0 ? ((curr2 - prev2) / Math.abs(prev2)) * 100 : null;
                }
                rows.push(row);
            }
            return { rows: rows };
        },

        render: function(result) {
            if (!result.rows || result.rows.length === 0) {
                return '<div class="np-empty">暂无数据</div>';
            }
            var hasN2 = result.rows.length >= 3;
            var html = '<table class="np-table"><thead><tr>';
            html += '<th>#</th><th>数值</th><th>N-1</th><th>N-1变化率</th>';
            if (hasN2) html += '<th>N-2</th><th>N-2变化率</th>';
            html += '</tr></thead><tbody>';

            for (var i = 0; i < result.rows.length; i++) {
                var r = result.rows[i];
                html += '<tr><td>' + r.index + '</td>';
                html += '<td class="np-num">' + formatNumber(r.value) + '</td>';
                if (i === 0) {
                    html += '<td class="np-diff-zero">—</td><td class="np-diff-zero">—</td>';
                    if (hasN2) html += '<td class="np-diff-zero">—</td><td class="np-diff-zero">—</td>';
                } else {
                    html += '<td class="np-num ' + diffClass(r.diffN1) + '">' +
                        (r.diffN1 > 0 ? '+' : '') + formatNumber(r.diffN1) + '</td>';
                    html += '<td class="np-num ' + diffClass(r.pctN1) + ' np-pct">' +
                        (r.pctN1 !== null ? formatPercent(r.pctN1) : '—') + '</td>';
                    if (hasN2) {
                        if (r.diffN2 !== undefined) {
                            html += '<td class="np-num ' + diffClass(r.diffN2) + '">' +
                                (r.diffN2 > 0 ? '+' : '') + formatNumber(r.diffN2) + '</td>';
                            html += '<td class="np-num ' + diffClass(r.pctN2) + ' np-pct">' +
                                (r.pctN2 !== null ? formatPercent(r.pctN2) : '—') + '</td>';
                        } else {
                            html += '<td class="np-diff-zero">—</td><td class="np-diff-zero">—</td>';
                        }
                    }
                }
                html += '</tr>';
            }
            html += '</tbody></table>';

            if (result.rows.length >= 2) {
                var first = result.rows[0].value;
                var last = result.rows[result.rows.length - 1].value;
                var totalDiff = last - first;
                var totalPct = first !== 0 ? (totalDiff / Math.abs(first)) * 100 : null;
                html += '<div style="margin-top:8px;padding:6px 8px;background:#eef2f7;border-radius:3px;font-size:12px;">';
                html += '<b>累计变化：</b>';
                html += '<span class="' + diffClass(totalDiff) + ' np-pct">' +
                    (totalDiff > 0 ? '+' : '') + formatNumber(totalDiff) + '</span>';
                html += ' <span class="' + diffClass(totalPct) + ' np-pct">' +
                    (totalPct !== null ? formatPercent(totalPct) : '—') + '</span>';
                html += '</div>';
            }
            return html;
        }
    });

    // ========== 表格验证模式 ==========
    var npImportedData = null;
    var npRowConfig = [];
    var npSubStartConfig = []; // 每行是否"新子表开始"
    // 初始快照：首次渲染时记录，供"恢复子表"/"恢复行类型"按钮回到初始状态
    var npOrigRowConfig = null;
    var npOrigSubStart = null;
    var npCustomOps = []; // 自定义运算表达式列表：{expr, compareRow, label}
    var npRowCoeff = [];   // 每行的乘/除参考行号（行类型为 multiply/divide 时使用）
    var npRowCompare = []; // 每行的对比行号（用于自定义运算的 compareRow）
    var npRowPct100 = [];  // 每行结果是否 ×100（百分比显示）

    function npDetectRowType(rowData, headers) {
        if (!rowData || rowData.length === 0) return 'data';
        var firstCell = rowData[0];
        if (firstCell === null || firstCell === undefined) return 'data';
        var label = String(firstCell).trim();
        if (/减[：:]/.test(label)) return 'subtract';
        return 'data';
    }

    // 自定义运算表达式解析（支持 3/4/100、3*(3+4)*100、3/4、3*4 等，括号可嵌套；无 eval/无 lookbehind，兼容旧 WebView）
    function parseCustomExpr(exprStr, parsed, c) {
        if (!exprStr || !exprStr.trim()) return null;
        var expr = exprStr.trim().replace(/×/g, '*').replace(/÷/g, '/');
        // 手写递归下降解析器：数字（行号/常量）、括号、+ - * /
        var pos = 0;
        var len = expr.length;
        function skipSpaces() { while (pos < len && /\s/.test(expr[pos])) pos++; }
        function parseFactor() {
            skipSpaces();
            if (pos >= len) return null;
            if (expr[pos] === '(') {
                pos++;
                var v = parseExpr();
                skipSpaces();
                if (pos < len && expr[pos] === ')') pos++;
                return v;
            }
            var start = pos;
            if (expr[pos] === '-' || expr[pos] === '+') pos++;
            while (pos < len && /[\d\.]/.test(expr[pos])) pos++;
            var token = expr.slice(start, pos).trim();
            if (!token) return null;
            // 判断是否为行号引用
            if (/^\d+[\.\d]*$/.test(token) || /^-?\d+$/.test(token)) {
                var numStr = token.replace(/^-/, '');
                var isNeg = token[0] === '-';
                var num = parseInt(numStr);
                if (!isNaN(num) && num > 0 && (num - 1) < parsed.dataRows.length) {
                    var v = parsed.dataRows[num - 1][c];
                    if (typeof v === 'number' && !isNaN(v)) {
                        return isNeg ? -v : v;
                    }
                }
                // 不是有效行号引用 → 当常量处理
                var constV = parseFloat(token);
                return (!isNaN(constV)) ? constV : null;
            }
            return null; // 无效 token
        }
        function parseTerm() {
            var v = parseFactor();
            if (v === null) return null;
            while (true) {
                skipSpaces();
                if (pos >= len) break;
                var ch = expr[pos];
                if (ch === '*' || ch === '/') {
                    pos++;
                    var r = parseFactor();
                    if (r === null) return null;
                    v = (ch === '*') ? v * r : (r !== 0 ? v / r : null);
                    if (v === null) return null;
                } else {
                    break;
                }
            }
            return v;
        }
        function parseExpr() {
            var v = parseTerm();
            if (v === null) return null;
            while (true) {
                skipSpaces();
                if (pos >= len) break;
                var ch = expr[pos];
                if (ch === '+' || ch === '-') {
                    pos++;
                    var r = parseTerm();
                    if (r === null) return null;
                    v = (ch === '+') ? v + r : v - r;
                } else {
                    break;
                }
            }
            return v;
        }
        skipSpaces();
        var result = parseExpr();
        skipSpaces();
        if (result === null || (pos < len && (expr[pos] === ')' || /[a-zA-Z]/.test(expr[pos])))) return null;
        return result;
    }

    // 获取某行的名称（textRows 优先，其次 dataRows，最后"第N行"）
    function getRowName(parsed, rowIdx) {
        if (!parsed || rowIdx < 0 || rowIdx >= parsed.dataRows.length) return '';
        var name = '';
        if (parsed.textRows && parsed.textRows[rowIdx] && parsed.textRows[rowIdx][0] !== undefined && parsed.textRows[rowIdx][0] !== null) {
            name = String(parsed.textRows[rowIdx][0]).trim();
        }
        if (!name && parsed.dataRows[rowIdx][0] !== undefined && parsed.dataRows[rowIdx][0] !== null) {
            name = String(parsed.dataRows[rowIdx][0]).trim();
        }
        if (!name) name = '第' + (rowIdx + 1) + '行';
        return name;
    }

    // 根据表达式中的行号生成带名称的标签（供汇总表显示）
    function formatExprLabel(exprStr, parsed) {
        if (!exprStr) return exprStr;
        var labelExpr = exprStr.trim();
        labelExpr = labelExpr.replace(/×/g, '/').replace(/÷/g, '/'); // 统一用 / 表示除法关系（仅用于显示）
        labelExpr = labelExpr.replace(/\d+([\.\d]*)/g, function(m, d1) {
            var num = parseInt(m);
            if (num > 0 && (num - 1) < parsed.dataRows.length) {
                var rowName = getRowName(parsed, num - 1);
                return '[' + num + ' ' + rowName + ']';
            }
            return m;
        });
        return labelExpr;
    }

    // 批量指定行类型（不使用字符串筛选）
    function batchSetRowType(type) {
        if (!npRowConfig || !npSubStartConfig || npRowConfig.length === 0) return;
        for (var i = 0; i < npRowConfig.length; i++) {
            if (type === 'sub') {
                npSubStartConfig[i] = true;
                npRowConfig[i] = 'data';
            } else if (type === 'data' || type === 'ignore' || type === 'subtract') {
                npSubStartConfig[i] = false;
                npRowConfig[i] = type;
            }
        }
        // 同步 DOM 单选按钮状态
        var radios = document.querySelectorAll('.np-row-radio');
        for (var ri = 0; ri < radios.length; ri++) {
            var rIdx = parseInt(radios[ri].dataset.row);
            var val = radios[ri].value;
            if (!isNaN(rIdx) && npRowConfig && rIdx < npRowConfig.length) {
                radios[ri].checked = (npRowConfig[rIdx] === val);
            }
        }
        // 同步子表复选框状态
        var subChecks = document.querySelectorAll('.np-sub-start');
        for (var si = 0; si < subChecks.length; si++) {
            var sIdx = parseInt(subChecks[si].dataset.row);
            if (!isNaN(sIdx) && npSubStartConfig && sIdx < npSubStartConfig.length) {
                subChecks[si].checked = !!npSubStartConfig[sIdx];
            }
        }
        npCalculate();
        npSaveState();
        document.getElementById('npAutoMarkMsg').textContent = '已批量设置为：' + (type === 'sub' ? '子表' : type === 'data' ? '普通' : type === 'ignore' ? '无关' : type === 'subtract' ? '减数' : type);
    }

    // 自定义运算（表达式输入 + 对比行 + ×100）
    function clearCustomOps() {
        npCustomOps = [];
        document.getElementById('npCustomMsg').textContent = '已清空运算列表';
        npCalculate();
        npSaveState();
    }

    function addCustomOp() {
        var exprEl = document.getElementById('npCustomExpr');
        var cmpEl = document.getElementById('npCustomCompare');
        var pctEl = document.getElementById('npCustomPct');
        var msgEl = document.getElementById('npCustomMsg');
        if (!exprEl) return;
        var exprText = exprEl.value.trim();
        if (!exprText) { msgEl.textContent = '请输入表达式（如 3/4/100 或 3*4*100）'; return; }
        var cmpRow = cmpEl ? (parseInt(cmpEl.value) || null) : null;
        var isPct = pctEl ? pctEl.checked : false;
        npCustomOps.push({ expr: exprText, compareRow: cmpRow, isPct: isPct, label: exprText + (isPct ? ' ×100' : '') + (cmpRow ? ' (vs ' + cmpRow + ')' : '') });
        exprEl.value = '';
        cmpEl.value = '';
        pctEl.checked = false;
        msgEl.textContent = '已添加运算：' + exprText;
        npCalculate();
        npSaveState();
    }

    registerMode('table-verify', {
        name: '表格验证',
        minInputs: 2,

        options: function() {
            return '<div id="npTableOptions">' +
                '<button id="npBtnImport" style="margin-right:6px;padding:4px 10px;font-size:12px;background:#2b579a;color:white;border:none;border-radius:3px;cursor:pointer;">从Word导入</button>' +
                '<span style="font-size:11px;color:#777;">选中Word表格任意单元格后点击</span>' +
                '<div id="npImportStatus" style="margin-top:4px;font-size:11px;color:#888;"></div>' +
                '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;">' +
                '<label style="display:flex;align-items:center;gap:4px;cursor:pointer;">' +
                '<input type="checkbox" id="npOptHasTotal" checked>' +
                '<span>最后一行是合计行</span>' +
                '</label>' +
                '<label style="display:flex;align-items:center;gap:4px;">' +
                '<input type="number" id="npOptHeaderRows" value="1" min="0" max="10" style="width:40px;padding:2px;font-size:12px;">' +
                '<span>表头行数</span>' +
                '</label>' +
                '</div>' +
                '<div id="npRowConfigArea" style="margin-top:6px;"></div>' +
                '<div id="npColChecks" style="margin-top:6px;"></div>' +
                '<div id="npPctConfig" style="margin-top:8px;border-top:1px solid #e5e5e5;padding-top:6px;"></div>' +
            '</div>';
        },

        updateOptions: function(text) {
            var rowArea = document.getElementById('npRowConfigArea');
            var colArea = document.getElementById('npColChecks');
            var pctConfig = document.getElementById('npPctConfig');
            if (!rowArea) return;

            var parsed = npImportedData || parseTable(text);
            if (!parsed || !parsed.headers || parsed.headers.length === 0) {
                rowArea.innerHTML = '';
                colArea.innerHTML = '<span style="color:#999;">粘贴表格或点击「从Word导入」</span>';
                if (pctConfig) pctConfig.innerHTML = '';
                return;
            }

            // 保留已有配置（用户手动改过或上次会话恢复的），行数一致时优先沿用
            var savedRowCfg = null;
            var savedSubCfg = null;
            if (npRowConfig && npRowConfig.length === parsed.dataRows.length) savedRowCfg = npRowConfig.slice();
            if (npSubStartConfig && npSubStartConfig.length === parsed.dataRows.length) savedSubCfg = npSubStartConfig.slice();
            npRowConfig = [];
            npSubStartConfig = [];
            var hasTotalEl = document.getElementById('npOptHasTotal');
            var hasTotal = hasTotalEl ? hasTotalEl.checked : true;
            var rowHtml = '<div style="color:#333;margin-bottom:3px;">行类型（自动识别，可修改，勾选「子表」表示新子表开始）：</div>';
            for (var r = 0; r < parsed.dataRows.length; r++) {
                var rowData = parsed.dataRows[r];
                var rowType = npDetectRowType(rowData, parsed.headers);

                // 子表标记行：行类型固定为普通（标记行计入子表求和，但不作为合计行）
                var isSubStart = !!(savedSubCfg && savedSubCfg[r]);
                var effRowType = isSubStart ? 'data' : (savedRowCfg && savedRowCfg[r] ? savedRowCfg[r] : rowType);
                npRowConfig.push(effRowType);
                // 同步"子表"勾选状态到内存数组，保证渲染后 npSubStartConfig 与界面一致，
                // 否则会被清空并在保存时覆盖掉正确的勾选，刷新后丢失
                npSubStartConfig.push(isSubStart);

                // 使用textRows获取原始文本作为行标识
                var rowLabel = '';
                if (parsed.textRows && parsed.textRows[r]) {
                    var textVal = parsed.textRows[r][0];

            var failCount = 0;

            var hasTotalEl3 = document.getElementById('npOptHasTotal');
            var hasTotal3 = hasTotalEl3 ? hasTotalEl3.checked : true;

            // ===== 子表结构预计算 =====
            var subStartRows = [];
            for (var rs = 0; rs < parsed.dataRows.length; rs++) {
                if (npSubStartConfig && npSubStartConfig[rs]) subStartRows.push(rs);
            }
            var hasSubs = subStartRows.length > 0;

            var subRanges = [];       // {start, end, label, totalRowIdx}
            var globalTotalRow = -1;  // 全局总计行索引（子表模式下整表最后一行）

            if (hasSubs) {
                var lastIdx = parsed.dataRows.length - 1;
                // 勾选"最后一行是合计行"、最后一行不是标记行也不是无关行 → 作为全局总计行，不参与任何子表
                if (hasTotal3 && subStartRows[subStartRows.length - 1] < lastIdx && rowTypes[lastIdx] !== 'ignore') {
                    globalTotalRow = lastIdx;
                    lastIdx = lastIdx - 1;
                }
                // 子表1：第一个标记行之前的行
                if (subStartRows[0] > 0) {
                    subRanges.push({ start: 0, end: subStartRows[0] - 1, label: '子表1' });
                }
                // 子表2..N：从标记行起到下一个标记行前一行
                for (var si = 0; si < subStartRows.length; si++) {
                    var s = subStartRows[si];
                    var e = (si + 1 < subStartRows.length) ? subStartRows[si + 1] - 1 : lastIdx;
                    if (s > e) continue;
                    var label = '子表' + (si + 2);
                    if (parsed.textRows && parsed.textRows[s] && parsed.textRows[s][0]) {
                        var t = String(parsed.textRows[s][0]).trim();
                        if (t) label += '·' + t;
                    }
                    subRanges.push({ start: s, end: e, label: label });
                }
                // 预计算每个子表的合计行：范围内（跳过标记行）最后一行有数字的行
                for (var sr = 0; sr < subRanges.length; sr++) {
                    var rg = subRanges[sr];
                    var totalIdx = -1;
                    for (var rr = rg.end; rr >= rg.start; rr--) {
                        if (npSubStartConfig && npSubStartConfig[rr]) continue;
                        if (rowTypes[rr] === 'ignore') continue;   // 无关行不可能是合计行
                        var hasAny = false;
                        for (var cc = 0; cc < parsed.headers.length; cc++) {
                            var vv = parsed.dataRows[rr][cc];
                            if (typeof vv === 'number' && !isNaN(vv)) { hasAny = true; break; }
                        }
                        if (hasAny) { totalIdx = rr; break; }
                    }
                    rg.totalRowIdx = totalIdx;
                }
            }

            var computeProcess = []; // 乘/除 运算过程记录

            for (var c = 0; c < parsed.headers.length; c++) {
                if (sumCols.indexOf(c) < 0) continue;
                var header = parsed.headers[c];

                if (hasSubs) {
                    // ===== 子表模式：每个子表独立验证 =====
                    var dataTotalAll = 0;  // 中间变量：所有明细行累计（不含子表合计行/总计行；子表标记行的数值计入）
                    var subTotalSum = 0;   // 各子表合计值之和

                    for (var sr2 = 0; sr2 < subRanges.length; sr2++) {
                        var rg2 = subRanges[sr2];
                        var computedSub = 0;
                        var formulaParts = [];
                        var hasComputed = false;

                        for (var rr2 = rg2.start; rr2 <= rg2.end; rr2++) {
                            // 子表标记行（打钩行）是该子表的第一行：其数值计入子表求和，不作为合计行
                            if (rr2 === rg2.totalRowIdx) continue;
                            var rowType = rowTypes[rr2];
                            if (rowType === 'ignore') continue;
                            var coeff = (rowType === 'subtract') ? -1 : 1;
                            var val = parsed.dataRows[rr2][c];
                            if (typeof val !== 'number' || isNaN(val)) continue;
                            computedSub += val * coeff;
                            dataTotalAll += val * coeff;
                            hasComputed = true;
                            var numStr = formatNumber(val);
                            if (formulaParts.length === 0) {
                                formulaParts.push(coeff === -1 ? '-' + numStr : numStr);
                            } else {
                                formulaParts.push(coeff === -1 ? '-' + numStr : '+' + numStr);
                            }
                        }

                        var actualSub = null;
                        var actualSubLabel = '';
                        if (rg2.totalRowIdx >= 0) {
                            var av = parsed.dataRows[rg2.totalRowIdx][c];
                            if (typeof av === 'number' && !isNaN(av)) {
                                actualSub = av;
                                subTotalSum += av;
                            }
                            if (parsed.textRows && parsed.textRows[rg2.totalRowIdx] && parsed.textRows[rg2.totalRowIdx][0]) {
                                actualSubLabel = String(parsed.textRows[rg2.totalRowIdx][0]).trim();
                            }
                        }

                        if (rg2.totalRowIdx < 0) {
                            // 该子表无任何数字：跳过
                            continue;
                        }
                        var diffSub = computedSub - actualSub;
                        var tolSub = Math.max(1, Math.abs(actualSub) * 0.001);
                        var passSub = actualSub !== null && Math.abs(diffSub) < tolSub;
                        results.push({
                            type: 'sub',
                            subLabel: rg2.label,
                            header: header,
                            rowLabel: actualSubLabel,
                            computed: computedSub,
                            actual: actualSub,
                            diff: diffSub,
                            pass: passSub,
                            formula: '=' + formulaParts.join(''),
                            colIdx: c,
                            rowIdx: rg2.totalRowIdx
                        });
                        if (passSub) passCount++; else failCount++;
                    }

                    // ===== 全局总计双验证 =====
                    if (globalTotalRow >= 0) {
                        var actualTotal = parsed.dataRows[globalTotalRow][c];
                        if (typeof actualTotal !== 'number' || isNaN(actualTotal)) actualTotal = null;

                        var totalLabel = '';
                        if (parsed.textRows && parsed.textRows[globalTotalRow] && parsed.textRows[globalTotalRow][0]) {
                            totalLabel = String(parsed.textRows[globalTotalRow][0]).trim();
                        }
                        if (!totalLabel) totalLabel = '总计';

                        if (actualTotal !== null) {
                            // 方式A：各子表合计值之和
                            var diffA = subTotalSum - actualTotal;
                            var tolA = Math.max(1, Math.abs(actualTotal) * 0.001);
                            var passA = Math.abs(diffA) < tolA;
                            // 方式B：明细直接累计
                            var diffB = dataTotalAll - actualTotal;
                            var tolB = Math.max(1, Math.abs(actualTotal) * 0.001);
                            var passB = Math.abs(diffB) < tolB;

                            results.push({
                                type: 'global',
                                header: header,
                                rowLabel: totalLabel,
                                actual: actualTotal,
                                subTotalSum: subTotalSum,
                                dataTotalAll: dataTotalAll,
                                diffA: diffA,
                                passA: passA,
                                diffB: diffB,
                                passB: passB,
                                colIdx: c,
                                rowIdx: globalTotalRow
                            });
                            if (passA) passCount++; else failCount++;
                            if (passB) passCount++; else failCount++;
                        }
                    }
                } else {
                    // ===== 原旧逻辑（无子表标记时保持完全一致） =====
                    var computedVal = 0;
                    var formulaParts2 = [];
                    var actualVal = null;
                    var actualRowLabel = '';

                    for (var r = 0; r < parsed.dataRows.length; r++) {
                        var rowType = rowTypes[r];
                        var coeff;
                        if (rowType === 'data') coeff = 1;
                        else if (rowType === 'subtract') coeff = -1;
                        else if (rowType === 'ignore') coeff = 0;
                        else if (rowType === 'multiply') {
                            var refRowM = (npRowCoeff && npRowCoeff[r] !== undefined && npRowCoeff[r] !== null) ? parseInt(npRowCoeff[r]) : null;
                            coeff = (refRowM !== null && refRowM > 0 && (refRowM - 1) < parsed.dataRows.length) ? (typeof parsed.dataRows[refRowM - 1][c] === 'number' && !isNaN(parsed.dataRows[refRowM - 1][c]) ? parsed.dataRows[refRowM - 1][c] : 1) : 1;
                        } else if (rowType === 'divide') {
                            var refRowD2 = (npRowCoeff && npRowCoeff[r] !== undefined && npRowCoeff[r] !== null) ? parseInt(npRowCoeff[r]) : null;
                            var refValD2 = (refRowD2 !== null && refRowD2 > 0 && (refRowD2 - 1) < parsed.dataRows.length) ? (typeof parsed.dataRows[refRowD2 - 1][c] === 'number' && !isNaN(parsed.dataRows[refRowD2 - 1][c]) ? parsed.dataRows[refRowD2 - 1][c] : null) : null;
                            coeff = (refValD2 !== null && refValD2 !== 0) ? (1 / refValD2) : 1;
                        }
                        else coeff = 1;

                        var val = parsed.dataRows[r][c];
                        if (typeof val !== 'number' || isNaN(val)) continue;
                        // 记录乘/除运算过程
                        if (rowType === 'multiply' || rowType === 'divide') {
                            var refRowNum2 = (npRowCoeff && npRowCoeff[r] !== undefined && npRowCoeff[r] !== null) ? parseInt(npRowCoeff[r]) : null;
                            var refLabel2 = '';
                            if (refRowNum2 !== null && refRowNum2 > 0 && (refRowNum2 - 1) < parsed.dataRows.length) {
                                if (parsed.textRows && parsed.textRows[refRowNum2 - 1] && parsed.textRows[refRowNum2 - 1][0]) {
                                    refLabel2 = String(parsed.textRows[refRowNum2 - 1][0]).trim();
                                } else {
                                    refLabel2 = '第' + refRowNum2 + '行';
                                }
                            }
                            var isPct100b = !!(npRowPct100 && npRowPct100[r]);
                            var cmpRowNum2 = (npRowCompare && npRowCompare[r] !== undefined && npRowCompare[r] !== null) ? parseInt(npRowCompare[r]) : null;
                            var resVal2 = val * coeff;
                            if (isPct100b) resVal2 = resVal2 * 100;
                            computeProcess.push({
                                rowLabel: (parsed.textRows && parsed.textRows[r] && parsed.textRows[r][0]) ? String(parsed.textRows[r][0]).trim() : ('第' + (r + 1) + '行'),
                                rowIndex: r + 1,
                                operation: rowType === 'multiply' ? '×' : '÷',
                                refRowNum: refRowNum2,
                                refLabel: refLabel2,
                                refValue: (refRowNum2 !== null && refRowNum2 > 0 && (refRowNum2 - 1) < parsed.dataRows.length) ? parsed.dataRows[refRowNum2 - 1][c] : null,
                                value: val,
                                coeff: coeff,
                                result: resVal2,
                                isPct100: isPct100b,
                                compareRow: cmpRowNum2,
                                colIndex: c,
                                colHeader: parsed.headers[c]
                            });
                        }

                        if (hasTotal3 && r === parsed.dataRows.length - 1 && rowType !== 'ignore') {
                            actualVal = val;
                            // 优先使用textRows获取原始文本
                            if (parsed.textRows && parsed.textRows[r] && parsed.textRows[r][0]) {
                                actualRowLabel = String(parsed.textRows[r][0]).trim();
                            } else {
                                var firstCell = parsed.dataRows[r][0];
                                actualRowLabel = firstCell !== null && firstCell !== undefined ? String(firstCell).trim() : ('第' + (r + 1) + '行');
                            }
                            break;
                        }

                        computedVal += val * coeff;
                        var numStr = formatNumber(val);
                        if (formulaParts2.length === 0) {
                            formulaParts2.push(coeff === -1 ? '-' + numStr : numStr);
                        } else if (coeff === 1) {
                            formulaParts2.push('+' + numStr);
                        } else if (coeff === -1) {
                            formulaParts2.push('-' + numStr);
                        }
                    }

                    if (!hasTotal3) {
                        var diff = 0;
                        var pass = true;
                        results.push({
                            type: 'sum',
                            header: header,
                            rowLabel: '合计',
                            rowType: 'sum',
                            computed: computedVal,
                            actual: null,
                            diff: 0,
                            pass: true,
                            formula: '=' + formulaParts2.join(''),
                            colIdx: c,
                            rowIdx: -1
                        });
                        passCount++;
                    } else if (hasTotal3 && rowTypes[parsed.dataRows.length - 1] === 'ignore') {
                        // 最后一行被标记为无关，不作为合计行
                        results.push({
                            type: 'sum',
                            header: header,
                            rowLabel: '合计（最后一行已标记为无关，未验证）',
                            rowType: 'sum',
                            computed: computedVal,
                            actual: null,
                            diff: 0,
                            pass: true,
                            formula: '=' + formulaParts2.join(''),
                            colIdx: c,
                            rowIdx: parsed.dataRows.length - 1
                        });
                        passCount++;
                    } else if (actualVal !== null && typeof actualVal === 'number') {
                        var diff2 = computedVal - actualVal;
                        var tolerance = Math.max(1, Math.abs(actualVal) * 0.001);
                        var pass2 = Math.abs(diff2) < tolerance;

                        results.push({
                            type: 'sum',
                            header: header,
                            rowLabel: actualRowLabel,
                            rowType: 'total',
                            computed: computedVal,
                            actual: actualVal,
                            diff: diff2,
                            pass: pass2,
                            formula: '=' + formulaParts2.join(''),
                            colIdx: c,
                            rowIdx: parsed.dataRows.length - 1
                        });
                        if (pass2) passCount++; else failCount++;
                    }
                }
            }

            // ===== 比例验证：收集所有活动组（默认 + 新增组）独立计算输出 =====
            var pctGroups = [];
            // 默认组
            var defColEl = document.getElementById('npPctCol');
            var defSrcEl = document.getElementById('npPctSrcCol');
            var defDenomEl = document.getElementById('npPctDenom');
            var defValEl = document.getElementById('npPctDenomVal');
            if (defColEl && defColEl.value !== '' && defSrcEl && defSrcEl.value !== '') {
                pctGroups.push({
                    label: '比例验证（默认组）',
                    col: parseInt(defColEl.value),
                    src: parseInt(defSrcEl.value),
                    denomType: defDenomEl ? defDenomEl.value : 'sum',
                    denomCustom: defValEl ? parseFloat(defValEl.value) : NaN,
                    denomDesc: (defDenomEl ? defDenomEl.value : 'sum') === 'sum' ? '源列合计' : ((defDenomEl ? defDenomEl.value : 'sum') === 'last' ? '源列末值' : '自定义 ' + (defValEl ? formatNumber(parseFloat(defValEl.value) || 0) : ''))
                });
            }
            // 新增组（从容器中扫描所有有效配置）
            var grpContainer = document.getElementById('npPctGroups');
            if (grpContainer) {
                var grpSelects = grpContainer.querySelectorAll('select');
                // 每组有3个select，按顺序读取
                for (var grpScan = 0; grpScan < grpSelects.length; grpScan += 3) {
                    var grpColEl = grpSelects[grpScan];
                    var grpSrcEl = grpScan + 1 < grpSelects.length ? grpSelects[grpScan + 1] : null;
                    var grpDenomEl = grpScan + 2 < grpSelects.length ? grpSelects[grpScan + 2] : null;
                    var grpValEl = grpColEl ? grpColEl.parentElement ? grpColEl.parentElement.querySelector('input[type="number"]') : null : null;
                    // 使用组内标题作为标签（从组容器的标题文本提取）
                    var grpTitleEl = grpColEl ? grpColEl.closest('div[style*="margin-top:8px"]') ? grpColEl.closest('div').querySelector('div[style*="font-weight:bold"]') : null : null;
                    var grpLabelText = '新增列验证组';
                    if (grpTitleEl && grpTitleEl.textContent) {
                        grpLabelText = grpTitleEl.textContent.trim();
                    }
                    if (grpColEl && grpColEl.value !== '' && grpSrcEl && grpSrcEl.value !== '') {
                        pctGroups.push({
                            label: grpLabelText,
                            col: parseInt(grpColEl.value),
                            src: parseInt(grpSrcEl.value),
                            denomType: grpDenomEl ? grpDenomEl.value : 'sum',
                            denomCustom: grpValEl ? parseFloat(grpValEl.value) : NaN,
                            denomDesc: (grpDenomEl ? grpDenomEl.value : 'sum') === 'sum' ? '源列合计' : ((grpDenomEl ? grpDenomEl.value : 'sum') === 'last' ? '源列末值' : '自定义 ' + (grpValEl ? formatNumber(parseFloat(grpValEl.value) || 0) : ''))
                        });
                    }
                }
            }

            // ===== 每组独立计算比例验证 =====
            for (var pg = 0; pg < pctGroups.length; pg++) {
                var grp = pctGroups[pg];
                var pctCol = grp.col;
                var pctSrcCol = grp.src;
                var denomType = grp.denomType;
                var denomCustom = grp.denomCustom;

                var denominator = 0;
                if (denomType === 'sum') {
                    var srcSum = 0;
                    for (var sr = 0; sr < parsed.dataRows.length; sr++) {
                        var srType = rowTypes[sr];
                        var coeff2 = srType === 'data' ? 1 : srType === 'subtract' ? -1 : 0;
                        var sv = parsed.dataRows[sr][pctSrcCol];
                        if (typeof sv === 'number' && !isNaN(sv)) srcSum += sv * coeff2;
                    }
                    denominator = srcSum;
                } else if (denomType === 'last') {
                    if (parsed.dataRows.length > 0) {
                        var lastVal = parsed.dataRows[parsed.dataRows.length - 1][pctSrcCol];
                        if (typeof lastVal === 'number' && !isNaN(lastVal)) denominator = lastVal;
                    }
                } else if (denomType === 'custom') {
                    denominator = denomCustom;
                }

                var denomDesc = grp.denomDesc || '';
                if (pctCol >= 0 && pctSrcCol >= 0 && pctCol !== pctSrcCol) {
                    if (!denominator || denominator === 0 || isNaN(denominator)) {
                        results.push({
                            type: 'pct-config',
                            groupLabel: grp.label,
                            pass: false,
                            note: '分母无效，请选择有效数值或输入非零数值（组：' + grp.label + '）'
                        });
                        failCount++;
                    } else {
                        var pctResults = [];
                        for (var pr = 0; pr < parsed.dataRows.length; pr++) {
                            var prType = rowTypes[pr];
                            if (prType === 'ignore') continue;
                            var rowLabel2 = '';
                            if (parsed.textRows && parsed.textRows[pr] && parsed.textRows[pr][0]) {
                                rowLabel2 = String(parsed.textRows[pr][0]).trim();
                            } else if (parsed.dataRows[pr][0] !== null && parsed.dataRows[pr][0] !== undefined) {
                                rowLabel2 = String(parsed.dataRows[pr][0]);
                            } else {
                                rowLabel2 = '第' + (pr + 1) + '行';
                            }
                            var srcVal = parsed.dataRows[pr][pctSrcCol];
                            var pctVal = parsed.dataRows[pr][pctCol];

                            if (typeof srcVal !== 'number' || isNaN(srcVal)) {
                                pctResults.push({ row: rowLabel2, computed: null, expected: null, diff: null, pass: null, note: '源数值无效' });
                                continue;
                            }
                            if (typeof pctVal !== 'number' || isNaN(pctVal)) {
                                pctResults.push({ row: rowLabel2, computed: null, expected: null, diff: null, pass: null, note: '比例值无效' });
                                continue;
                            }

                            var computedPct = (srcVal / denominator) * 100;
                            var diffPct = computedPct - pctVal;
                            var pctTolerance = 0.1;
                            var pctPass = Math.abs(diffPct) < pctTolerance;
                            pctResults.push({
                                row: rowLabel2,
                                sourceValue: srcVal,
                                denominator: denominator,
                                computed: computedPct,
                                expected: pctVal,
                                diff: diffPct,
                                pass: pctPass
                            });
                            if (pctPass) passCount++; else failCount++;
                        }

                        var sameCount = 0, diffCount2 = 0, invalidCount2 = 0;
                        for (var cnt = 0; cnt < pctResults.length; cnt++) {
                            var cntRow = pctResults[cnt];
                            if (cntRow.note === '源数值无效') invalidCount2++;
                            else if (cntRow.pass) sameCount++;
                            else diffCount2++;
                        }
                        results.push({
                            type: 'pct',
                            groupLabel: grp.label,
                            pctHeader: parsed.headers[pctCol],
                            srcHeader: parsed.headers[pctSrcCol],
                            denomDesc: denomDesc,
                            denomValue: denominator,
                            rows: pctResults,
                            sameCount: sameCount,
                            diffCount: diffCount2,
                            invalidCount: invalidCount2
                        });
                    }
                }
            }

            // 自定义运算表达式计算（新增运算按钮生成）；一个表达式 = 汇总表一行，各列分别计算
            var customResults = [];
            if (npCustomOps && npCustomOps.length > 0) {
                for (var coIdx = 0; coIdx < npCustomOps.length; coIdx++) {
                    var co = npCustomOps[coIdx];
                    var opEntry = {
                        expr: co.expr,
                        label: co.label,
                        displayLabel: formatExprLabel(co.expr, parsed),
                        isPct: co.isPct,
                        compareRow: co.compareRow,
                        compareRowLabel: (co.compareRow && parsed) ? getRowName(parsed, co.compareRow - 1) : '',
                        cols: {}
                    };
                    var anyValid = false;
                    for (var coCol = 0; coCol < parsed.headers.length; coCol++) {
                        var exprResult = parseCustomExpr(co.expr, parsed, coCol);
                        var coActualRow = co.compareRow ? (co.compareRow - 1) : null;
                        var coActualVal = (coActualRow !== null && coActualRow >= 0 && coActualRow < parsed.dataRows.length && parsed.dataRows[coActualRow] !== undefined) ? parsed.dataRows[coActualRow][coCol] : null;
                        if (exprResult !== null) {
                            anyValid = true;
                            opEntry.cols[coCol] = {
                                result: co.isPct ? (exprResult * 100) : exprResult,
                                actual: (typeof coActualVal === 'number' && !isNaN(coActualVal)) ? coActualVal : null,
                                diff: (typeof coActualVal === 'number' && !isNaN(coActualVal)) ? ((co.isPct ? exprResult * 100 : exprResult) - coActualVal) : null,
                                pass: (typeof coActualVal === 'number' && !isNaN(coActualVal)) ? Math.abs(((co.isPct ? exprResult * 100 : exprResult) - coActualVal)) < Math.max(1, Math.abs(coActualVal) * 0.001) : null
                            };
                        }
                    }
                    if (anyValid) customResults.push(opEntry);
                }
            }

            return {
                headers: parsed.headers,
                results: results,
                customResults: customResults,
                computeProcess: computeProcess,
                summary: { pass: passCount, fail: failCount, total: results.length },
                // 供"检验结果汇总表"使用：原始数据网格（未验证列的原始值）
                dataRows: parsed.dataRows
            };
        },

        render: function(result) {
            if (result.error) return '<div class="np-error">' + result.error + '</div>';
            if (!result.results || result.results.length === 0) {
                return '<div class="np-empty">请勾选合计列，并/或设置比例验证</div>';
            }

            var html = '';
            for (var i = 0; i < result.results.length; i++) {
                var r = result.results[i];
                if (r.type === 'sum' || r.type === 'sub') {
                    var labelPrefix = r.type === 'sub' ? ('[' + r.subLabel + '] ') : '';
                    html += '<div class="np-verify-row">';
                    html += '<span class="np-verify-label">' + labelPrefix + r.header + (r.rowLabel !== '合计' ? ' · ' + r.rowLabel : '') + '</span>';
                    html += '<span class="np-verify-detail">';
                    if (r.actual !== null && r.actual !== undefined) {
                        html += '计算: <span class="np-verify-value">' + formatNumber(r.computed) + '</span> vs <span class="np-verify-value">' + formatNumber(r.actual) + '</span>';
                        html += ' 差: <span class="np-verify-diff ' + (r.pass ? 'np-verify-pass' : 'np-verify-fail') + '">' +
                            (r.diff > 0 ? '+' : '') + formatNumber(r.diff) + '</span>';
                    } else {
                        html += '计算合计: <span class="np-verify-value">' + formatNumber(r.computed) + '</span>';
                    }
                    if (r.formula) {
                        html += ' <span class="np-verify-formula">(' + r.formula + ')</span>';
                    }
                    if (r.actual !== null && r.actual !== undefined) {
                        html += ' <span class="np-badge ' + (r.pass ? 'np-badge-ok' : 'np-badge-fail') + '">' +
                            (r.pass ? '通过' : '不通过') + '</span>';
                    }
                    html += '</span></div>';
                } else if (r.type === 'global') {
                    html += '<div style="margin-top:6px;border-top:1px dashed #bbb;padding-top:4px;">';
                    html += '<div style="color:#1a5276;font-weight:600;font-size:12px;margin-bottom:2px;">' +
                        r.header + ' · ' + r.rowLabel + '（全局总计双验证）</div>';
                    html += '<div class="np-verify-row">';
                    html += '<span class="np-verify-label">方式A · 各子表合计之和</span>';
                    html += '<span class="np-verify-detail">计算: <span class="np-verify-value">' + formatNumber(r.subTotalSum) +
                        '</span> vs <span class="np-verify-value">' + formatNumber(r.actual) + '</span>';
                    html += ' 差: <span class="np-verify-diff ' + (r.passA ? 'np-verify-pass' : 'np-verify-fail') + '">' +
                        (r.diffA > 0 ? '+' : '') + formatNumber(r.diffA) + '</span>';
                    html += ' <span class="np-badge ' + (r.passA ? 'np-badge-ok' : 'np-badge-fail') + '">' +
                        (r.passA ? '通过' : '不通过') + '</span></span></div>';
                    html += '<div class="np-verify-row">';
                    html += '<span class="np-verify-label">方式B · 明细直接累计</span>';
                    html += '<span class="np-verify-detail">计算: <span class="np-verify-value">' + formatNumber(r.dataTotalAll) +
                        '</span> vs <span class="np-verify-value">' + formatNumber(r.actual) + '</span>';
                    html += ' 差: <span class="np-verify-diff ' + (r.passB ? 'np-verify-pass' : 'np-verify-fail') + '">' +
                        (r.diffB > 0 ? '+' : '') + formatNumber(r.diffB) + '</span>';
                    html += ' <span class="np-badge ' + (r.passB ? 'np-badge-ok' : 'np-badge-fail') + '">' +
                        (r.passB ? '通过' : '不通过') + '</span></span></div>';
                    html += '</div>';
                } else if (r.type === 'pct-config') {
                    html += '<div class="np-verify-row"><span class="np-verify-fail">⚠ ' + r.note + '</span></div>';
                }
            }

            if (result.summary) {
                var s = result.summary;
                html += '<div class="np-summary">';
                html += '验证 <b>' + s.total + '</b> 项：' +
                    '<span class="np-verify-pass">通过 ' + s.pass + '</span>，' +
                    '<span class="' + (s.fail > 0 ? 'np-verify-fail' : 'np-verify-pass') + '">不通过 ' + s.fail + '</span>';
                html += '</div>';
            }

            // ========== 检验结果汇总表（相同表头；仅列出有验证结果的合计/总计行，明细行与无关行不重复） ==========
            // （结论行已按用户要求移除，避免重复/破坏输出）
            if (result.dataRows && result.dataRows.length > 0 && result.headers && result.headers.length > 0) {
                // 建立 行_列 → 验证结果 的索引；无关行不计入合计、也没有验证条目，自然不会出现在汇总表
                var verdictMap = {};
                var rowMeta = {};
                for (var vi = 0; vi < result.results.length; vi++) {
                    var ve = result.results[vi];
                    if (ve.rowIdx === undefined || ve.rowIdx < 0 ||
                        ve.colIdx === undefined || ve.colIdx < 0) continue;
                    // 无实际合计值的条目（如"最后一行无关，未验证"）不列入汇总
                    if ((ve.type === 'sum' || ve.type === 'sub') &&
                        (ve.actual === null || ve.actual === undefined)) continue;
                    verdictMap[ve.rowIdx + '_' + ve.colIdx] = ve;
                    if (!rowMeta[ve.rowIdx]) {
                        rowMeta[ve.rowIdx] = (ve.type === 'sub')
                            ? (ve.subLabel || ('第' + (ve.rowIdx + 1) + '行'))
                            : (ve.rowLabel || ('第' + (ve.rowIdx + 1) + '行'));
                    }
                }
                var rowIdxs = [];
                for (var rid in rowMeta) rowIdxs.push(parseInt(rid));
                rowIdxs.sort(function(a, b) { return a - b; });
                // 自定义运算表达式结果加入汇总表（一个表达式 = 一行，各列分别显示）
                if (result.customResults && result.customResults.length > 0) {
                    for (var coR2 = 0; coR2 < result.customResults.length; coR2++) {
                        var coE = result.customResults[coR2];
                        for (var coColKey in coE.cols) {
                            var cColV = coE.cols[coColKey];
                            verdictMap['custom_' + coR2 + '_' + coColKey] = {
                                type: coE.isPct ? 'divide' : 'multiply',
                                computed: cColV.result,
                                isPct100: coE.isPct,
                                compareRow: coE.compareRow,
                                compareLabel: coE.compareRowLabel,
                                actual: cColV.actual,
                                diff: cColV.diff,
                                pass: cColV.pass,
                                rowLabel: coE.expr
                            };
                        }
                        rowMeta['custom_' + coR2] = coE.displayLabel + (coE.isPct ? ' ×100' : '') + (coE.compareRow ? ' (vs ' + coE.compareRow + ')' : '');
                        rowIdxs.push('custom_' + coR2);
                    }
                }

                if (rowIdxs.length > 0) {
                    function fmtCellVal(v) {
                        if (v !== null && v !== undefined && typeof v === 'number' && !isNaN(v)) return formatNumber(v);
                        return '<span style="color:#bbb;">—</span>';
                    }
                    function verdictHtml(ve) {
                        if (ve.type === 'sum' || ve.type === 'sub') {
                            var okS = ve.pass;
                            var txtS = (okS ? '✓ ' : '✗ ') + formatNumber(ve.computed) + ' = ' + formatNumber(ve.actual);
                            if (!okS && ve.diff !== undefined) {
                                txtS += ' <span style="font-size:10px;opacity:0.75;">(差 ' +
                                    (ve.diff > 0 ? '+' : '') + formatNumber(ve.diff) + ')</span>';
                            }
                            return '<span class="' + (okS ? 'np-verify-pass' : 'np-verify-fail') + '">' + txtS + '</span>';
                        }
                        if (ve.type === 'multiply' || ve.type === 'divide') {
                            var opStr = ve.type === 'multiply' ? '×' : '÷';
                            var okM = (ve.pass === true);
                            var hasAct = (ve.actual !== null && typeof ve.actual === 'number' && !isNaN(ve.actual));
                            var pctMark = ve.isPct100 ? '%' : '';
                            // 数据列只显示计算结果，不显示 vs 对比行（对比行名称在第一列）
                            var txtM = (okM ? '✓ ' : '✗ ') + opStr + ' ' + formatNumber(ve.computed) + pctMark;
                            if (hasAct) {
                                txtM += ' = ' + formatNumber(ve.actual) + pctMark;
                                if (ve.diff !== null && ve.diff !== undefined && !okM) {
                                    txtM += ' <span style="font-size:10px;opacity:0.75;">(差 ' +
                                        (ve.diff > 0 ? '+' : '') + formatNumber(ve.diff) + ')</span>';
                                }
                            } else {
                                txtM += ' (无实际值)';
                            }
                            return '<span class="' + (okM ? 'np-verify-pass' : 'np-verify-fail') + '">' + txtM + '</span>';
                        }
                        if (ve.type === 'global') {
                            return '<span class="' + (ve.passA ? 'np-verify-pass' : 'np-verify-fail') + '">A' +
                                (ve.passA ? '✓' : '✗') + '</span> ' +
                                '<span class="' + (ve.passB ? 'np-verify-pass' : 'np-verify-fail') + '">B' +
                                (ve.passB ? '✓' : '✗') + '</span> ' +
                                '<span>' + formatNumber(ve.dataTotalAll) + ' = ' + formatNumber(ve.actual) + '</span>';
                        }
                        return '';
                    }

                    var mHtml = '<div style="margin-top:10px;border-top:2px solid #2b579a;padding-top:8px;">';
                    mHtml += '<div style="font-size:12px;font-weight:bold;color:#2b579a;margin-bottom:6px;">检验结果汇总（合计/总计行：计算 vs 表中，✓=通过 ✗=不通过；无关行不计入）</div>';
                    mHtml += '<div style="max-height:320px;overflow-y:auto;border:1px solid #d0d7de;border-radius:3px;">';
                    mHtml += '<table class="np-table" style="margin:0;">';
                    mHtml += '<thead><tr>';
                    for (var mc = 0; mc < result.headers.length; mc++) {
                        mHtml += '<th>' + (result.headers[mc] || ('列' + (mc + 1))) + '</th>';
                    }
                    mHtml += '</tr></thead><tbody>';
                    // 新增第一行：结论（每列比例验证结晶：相同/不同/无效数量，来自默认或首个比例组）
                    var firstPct = null;
                    for (var resScan = 0; resScan < result.results.length; resScan++) {
                        if (result.results[resScan].type === 'pct') { firstPct = result.results[resScan]; break; }
                    }
                    if (false) {
                        // 结论行已按要求移除（避免与合计验证混在一起，保持输出清晰）
                    }

                    for (var mi = 0; mi < rowIdxs.length; mi++) {
                        var mr = rowIdxs[mi];
                        mHtml += '<tr>';
                        for (var mc2 = 0; mc2 < result.headers.length; mc2++) {
                            var entry = verdictMap[mr + '_' + mc2];
                            var rawVal = result.dataRows[mr] ? result.dataRows[mr][mc2] : null;
                            if (mc2 === 0 && typeof mr === 'string' && mr.indexOf('custom_') === 0) {
                                // 自定义运算行：第一列强制显示公式名称
                                mHtml += '<td><span style="color:#1a5276;font-weight:600;">' + rowMeta[mr] + '</span></td>';
                            } else if (entry) {
                                mHtml += '<td>' + verdictHtml(entry) + '</td>';
                            } else if (mc2 === 0) {
                                // 第一列：用合计/总计行的标识（子表用子表名）
                                mHtml += '<td><span style="color:#1a5276;font-weight:600;">' + rowMeta[mr] + '</span></td>';
                            } else {
                                mHtml += '<td class="' + (typeof rawVal === 'number' && !isNaN(rawVal) ? 'np-num' : '') + '">' +
                                    fmtCellVal(rawVal) + '</td>';
                            }
                        }
                        mHtml += '</tr>';
                    }
                    mHtml += '</tbody></table></div></div>';
                    html += mHtml;
                }
            }

            // ========== 比例验证结果放在最后（与合计验证分开） ==========
            for (var pi = 0; pi < result.results.length; pi++) {
                var pr = result.results[pi];
                if (pr.type === 'pct') {
                    html += '<div style="margin-top:10px;border-top:2px solid #2b579a;padding-top:6px;">';
                    html += '<div style="font-weight:bold;margin-bottom:4px;color:#2b579a;">比例验证: ' + pr.pctHeader + ' = ' + pr.srcHeader + ' / ' + pr.denomDesc + '(' + formatNumber(pr.denomValue) + ')</div>';
                    html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
                    html += '<tr style="background:#f5f5f5;"><th style="padding:3px 6px;text-align:left;border:1px solid #ddd;">行</th><th style="padding:3px 6px;text-align:right;border:1px solid #ddd;">' + pr.srcHeader + '</th><th style="padding:3px 6px;text-align:right;border:1px solid #ddd;">计算比例</th><th style="padding:3px 6px;text-align:right;border:1px solid #ddd;">表中比例</th><th style="padding:3px 6px;text-align:right;border:1px solid #ddd;">差额</th><th style="padding:3px 6px;text-align:center;border:1px solid #ddd;">状态</th></tr>';
                    for (var ri = 0; ri < (pr.rows ? pr.rows.length : 0); ri++) {
                        var rr = pr.rows[ri];
                        html += '<tr>';
                        html += '<td style="padding:3px 6px;border:1px solid #ddd;">' + rr.row + '</td>';
                        if (rr.computed === null) {
                            html += '<td colspan="4" style="padding:3px 6px;border:1px solid #ddd;color:#999;">' + (rr.note || '—') + '</td>';
                        } else {
                            html += '<td style="padding:3px 6px;text-align:right;border:1px solid #ddd;">' + formatNumber(rr.sourceValue) + '</td>';
                            html += '<td style="padding:3px 6px;text-align:right;border:1px solid #ddd;">' + rr.computed.toFixed(2) + '%</td>';
                            html += '<td style="padding:3px 6px;text-align:right;border:1px solid #ddd;">' + rr.expected.toFixed(2) + '%</td>';
                            html += '<td style="padding:3px 6px;text-align:right;border:1px solid #ddd;color:' + (Math.abs(rr.diff) < 0.1 ? '#1a7f37' : '#cf222e') + ';">' + (rr.diff > 0 ? '+' : '') + rr.diff.toFixed(2) + '%</td>';
                            html += '<td style="padding:3px 6px;text-align:center;border:1px solid #ddd;"><span class="np-badge ' + (rr.pass ? 'np-badge-ok' : 'np-badge-fail') + '">' + (rr.pass ? '通过' : '不通过') + '</span></td>';
                        }
                        html += '</tr>';
                    }
                    html += '</table>';
                    html += '</div>';
                }
            }

            return html;
        }
    });

    function parseTable(text) {
        if (!text || !text.trim()) return null;
        var lines = text.split(/[\n\r]+/);
        lines = lines.filter(function(l) { return l.trim(); });
        if (lines.length < 2) return null;

        var headerRowsEl = document.getElementById('npOptHeaderRows');
        var headerRowCount = headerRowsEl ? parseInt(headerRowsEl.value) || 1 : 1;

        var splitRegex = detectDelimiter(lines);

        // 合并多行表头
        var headers = [];
        if (headerRowCount <= 1) {
            headers = lines[0].split(splitRegex).map(function(s, ci) {
                var val = s.trim();
                return val || ('列' + (ci + 1));
            });
        } else {
            var colCount = lines[0].split(splitRegex).length;
            for (var c = 0; c < colCount; c++) {
                var combined = '';
                for (var hr = 0; hr < Math.min(headerRowCount, lines.length); hr++) {
                    var cells = lines[hr].split(splitRegex);
                    var cellVal = (cells[c] || '').trim();
                    if (cellVal) {
                        if (combined) combined += '+';
                        combined += cellVal;
                    }
                }
                headers.push(combined || ('列' + (c + 1)));
            }
        }
        if (headers.length < 2) return null;

        var dataRows = [];
        var textRows = [];
        for (var i = headerRowCount; i < lines.length; i++) {
            var cells = lines[i].split(splitRegex).map(function(s) { return s.trim(); });
            var row = [];
            var textRow = [];
            for (var c = 0; c < headers.length; c++) {
                textRow.push(cells[c] || '');
                var val = null;
                if (cells[c] !== undefined && cells[c] !== '') {
                    val = parseNumber(cells[c]);
                }
                row.push(val);
            }
            dataRows.push(row);
            textRows.push(textRow);
        }

        var hasTotalEl = document.getElementById('npOptHasTotal');
        var hasTotal = hasTotalEl ? hasTotalEl.checked : true;
        var totals = null;
        if (hasTotal && dataRows.length > 0) {
            totals = dataRows[dataRows.length - 1].slice();
        }

        return { headers: headers, dataRows: dataRows, textRows: textRows, totals: totals };
    }

    function parseHtmlTable(html) {
        try {
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            var table = doc.querySelector('table');
            if (!table) return null;

            var rows = table.querySelectorAll('tr');
            if (rows.length < 2) return null;

            var maxCols = 0;
            var rawRows = [];
            for (var r = 0; r < rows.length; r++) {
                var cells = rows[r].querySelectorAll('td,th');
                var cellTexts = [];
                for (var c = 0; c < cells.length; c++) {
                    var colspan = parseInt(cells[c].getAttribute('colspan')) || 1;
                    var rowspan = parseInt(cells[c].getAttribute('rowspan')) || 1;
                    var text = cells[c].textContent.trim();
                    cellTexts.push({ text: text, colspan: colspan, rowspan: rowspan });
                }
                if (cellTexts.length === 0) continue;
                var totalSpan = 0;
                for (var s = 0; s < cellTexts.length; s++) totalSpan += cellTexts[s].colspan;
                if (totalSpan > maxCols) maxCols = totalSpan;
                rawRows.push(cellTexts);
            }

            if (maxCols === 0) return null;

            // 构建网格，处理 rowspan 和 colspan
            var grid = [];
            for (var ri = 0; ri < rawRows.length; ri++) {
                grid[ri] = new Array(maxCols).fill(null);
            }

            var rowSpans = []; // 跟踪 rowspan 占用的单元格
            for (var ri = 0; ri < rawRows.length; ri++) {
                var row = rawRows[ri];
                var colIdx = 0;
                var rowSpanIdx = 0;

                for (var ci = 0; ci < row.length; ci++) {
                    while (colIdx < maxCols && (grid[ri][colIdx] !== null ||
                        (rowSpans[colIdx] && rowSpans[colIdx] > ri))) {
                        colIdx++;
                    }
                    if (colIdx >= maxCols) break;

                    var span = row[ci].colspan;
                    var rspan = row[ci].rowspan;

                    for (var sp = 0; sp < span; sp++) {
                        if (colIdx + sp < maxCols) {
                            grid[ri][colIdx + sp] = row[ci].text;
                        }
                    }

                    // 处理 rowspan（跨越后续行）
                    if (rspan > 1) {
                        for (var rs = 1; rs < rspan; rs++) {
                            if (ri + rs < rawRows.length) {
                                for (var sp = 0; sp < span; sp++) {
                                    if (colIdx + sp < maxCols) {
                                        grid[ri + rs][colIdx + sp] = '';
                                    }
                                }
                            }
                        }
                    }

                    colIdx += span;
                }
            }

            // 使用用户指定的表头行数
            var headerRowsEl2 = document.getElementById('npOptHeaderRows');
            var headerRowCount2 = headerRowsEl2 ? parseInt(headerRowsEl2.value) || 1 : 1;

            // 合并多行表头
            var headerTexts = [];
            if (headerRowCount2 <= 1) {
                headerTexts = grid[0].map(function(s, ci) {
                    var val = (s || '').trim();
                    return val || ('列' + (ci + 1));
                });
            } else {
                for (var c = 0; c < maxCols; c++) {
                    var combined = '';
                    for (var hr = 0; hr < Math.min(headerRowCount2, grid.length); hr++) {
                        var cellVal = grid[hr][c];
                        if (cellVal && cellVal.trim()) {
                            if (combined) combined += '+';
                            combined += cellVal.trim();
                        }
                    }
                    headerTexts.push(combined || ('列' + (c + 1)));
                }
            }

            // 数据行从表头之后开始
            var dataStartIdx = headerRowCount2;
            var dataRows = [];
            var textRows = [];
            for (var di = dataStartIdx; di < grid.length; di++) {
                var row = [];
                var textRow = [];
                for (var dc = 0; dc < maxCols; dc++) {
                    var cellText = grid[di][dc];
                    textRow.push(cellText || '');
                    var val = null;
                    if (cellText !== null && cellText !== undefined && String(cellText).trim() !== '') {
                        val = parseNumber(String(cellText));
                    }
                    row.push(val);
                }
                dataRows.push(row);
                textRows.push(textRow);
            }

            var hasTotalEl2 = document.getElementById('npOptHasTotal');
            var hasTotal2 = hasTotalEl2 ? hasTotalEl2.checked : true;
            var totals2 = null;
            if (hasTotal2 && dataRows.length > 0) {
                totals2 = dataRows[dataRows.length - 1].slice();
            }

            return { headers: headerTexts, dataRows: dataRows, textRows: textRows, totals: totals2 };
        } catch (e) {
            return null;
        }
    }

    function detectDelimiter(lines) {
        var firstTabs = lines[0].split(/\t/).length;
        if (firstTabs >= 2) return /\t/;

        var maxCols = 0;
        for (var i = 0; i < Math.min(lines.length, 10); i++) {
            var parts = lines[i].split(/\s{2,}/);
            if (parts.length > maxCols) maxCols = parts.length;
        }
        if (maxCols >= 2) return /\s{2,}/;

        return /\s+/;
    }
    // ========== 主控制器 ==========
    var npInput, npResult, npResultContent, npResultTitle, npModesEl, npOptionsEl;
    var npDebounceTimer = null;
    var npImportedData = null;

    // ========== Word API 导入表格 ==========
    function npImportWordTable() {
        var statusEl = document.getElementById('npImportStatus');
        if (statusEl) { statusEl.style.color = '#888'; statusEl.textContent = '正在读取Word表格…'; }

        if (typeof Word === 'undefined') {
            if (statusEl) { statusEl.style.color = '#cf222e'; statusEl.textContent = '当前不在Word环境'; }
            return;
        }

        Word.run(function(ctx) {
            var tables = ctx.document.body.tables;
            tables.load('items');
            var selRange = ctx.document.getSelection().getRange();
            selRange.load(['start', 'end']);
            var isCollapsed = selRange.load('isCollapsed');

            return ctx.sync().then(function() {
                if (!tables.items || tables.items.length === 0) {
                    throw new Error('文档中没有表格');
                }

                var caret = selRange.start;
                var selEnd = selRange.end;
                var tblRanges = [];

                for (var i = 0; i < tables.items.length; i++) {
                    var r = tables.items[i].getRange();
                    r.load(['start', 'end']);
                    tblRanges.push(r);
                }

                return ctx.sync().then(function() {
                    var bestIdx = -1, bestStart = -Infinity;
                    for (var j = 0; j < tblRanges.length; j++) {
                        var start = tblRanges[j].start;
                        var end = tblRanges[j].end;
                        if (start <= caret && caret < end && start > bestStart) {
                            bestStart = start;
                            bestIdx = j;
                        }
                    }

                    if (bestIdx < 0) {
                        throw new Error('光标不在表格内，请把光标放入表格单元格');
                    }

                    var tbl = tables.items[bestIdx];
                    tbl.load('values');

                    // 检测是否选中了表格的一部分
                    var isPartialSelection = (!isCollapsed && selEnd > caret &&
                        caret >= tblRanges[bestIdx].start && selEnd <= tblRanges[bestIdx].end);

                    return ctx.sync().then(function() {
                        var data2d = tbl.values;
                        if (!data2d || data2d.length === 0) {
                            throw new Error('该表格为空');
                        }

                        console.log('tbl.values 原始数据:', data2d);

                        // 如果选中了表格的一部分，只导入选中的行
                        if (isPartialSelection) {
                            var rows = tbl.rows;
                            rows.load('items');

                            return ctx.sync().then(function() {
                                var selectedRowIndices = [];
                                for (var ri = 0; ri < rows.items.length; ri++) {
                                    var rowRange = rows.items[ri].getRange();
                                    rowRange.load(['start', 'end']);
                                }

                                return ctx.sync().then(function() {
                                    for (var rj = 0; rj < rows.items.length; rj++) {
                                        var rStart = rows.items[rj].getRange().start;
                                        var rEnd = rows.items[rj].getRange().end;
                                        if (rStart < selEnd && rEnd > caret) {
                                            selectedRowIndices.push(rj);
                                        }
                                    }

                                    var selectedData = [];
                                    for (var si = 0; si < selectedRowIndices.length; si++) {
                                        selectedData.push(data2d[selectedRowIndices[si]]);
                                    }

                                    npProcessImportedData(selectedData, statusEl, '选中区域');
                                });
                            });
                        } else {
                            npProcessImportedData(data2d, statusEl, '整个表格');
                        }
                    });
                });
            });
        }).catch(function(err) {
            // 若渲染已重建选项区，原 statusEl 可能已脱离 DOM，需重新获取，否则失败提示不可见
            if (statusEl && !document.body.contains(statusEl)) {
                var freshEl = document.getElementById('npImportStatus');
                if (freshEl) statusEl = freshEl;
            }
            if (typeof console !== 'undefined') console.error('[npState] 导入表格失败:', err && (err.message || err));
            if (statusEl) {
                statusEl.style.color = '#cf222e';
                statusEl.textContent = '导入失败：' + (err.message || err);
            }
        });
    }

    // 检测一行中是否存在重复模式，返回模式长度
    function findPatternLength(row, expectedGroups) {
        if (!row || row.length < 4) return 1;

        // 尝试不同的模式长度
        var maxPatternLen = Math.floor(row.length / 2);
        for (var plen = 2; plen <= maxPatternLen; plen++) {
            // 检查模式是否重复足够多次
            var patternCount = Math.floor(row.length / plen);
            if (patternCount < 2) continue;

            // 验证模式是否真的重复
            var isPattern = true;
            for (var p = 0; p < plen; p++) {
                var baseVal = String(row[p] || '').trim();
                for (var g = 1; g < patternCount; g++) {
                    var checkVal = String(row[g * plen + p] || '').trim();
                    if (baseVal !== checkVal) {
                        // 允许空值不匹配（因为可能有合并单元格的空值）
                        if (baseVal !== '' && checkVal !== '') {
                            isPattern = false;
                            break;
                        }
                    }
                }
                if (!isPattern) break;
            }

            if (isPattern) return plen;
        }

        return 1;
    }

    function npProcessImportedData(data2d, statusEl, sourceDesc) {
        if (!data2d || data2d.length === 0) {
            throw new Error('数据为空');
        }

        // 调试：显示原始数据结构
