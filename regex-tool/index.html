<!DOCTYPE html> <html> <head>     <meta charset="utf-8">     <title>正则工具</title>     <style>         body { font-family: 'Microsoft YaHei', sans-serif; padding: 10px; margin: 0; }         p { margin: 8px 0 4px 0; font-size: 13px; }         button { padding: 8px 16px; margin-right: 6px; cursor: pointer; border-radius: 4px; border: none; font-size: 12px; }         input, textarea { padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: Consolas, monospace; }         textarea { font-size: 13px; resize: vertical; }         #regexFindBtn, #regexSelectAllBtn, #regexPrevBtn, #regexNextBtn { background: white; border: 1px solid #2b579a; color: #2b579a; }         #regexFindBtn:hover, #regexSelectAllBtn:hover, #regexPrevBtn:hover, #regexNextBtn:hover { background: #2b579a; color: white; }         #regexReplaceAllBtn, #regexReplaceBtn { background: white; border: 1px solid #e65100; color: #e65100; }         #regexReplaceAllBtn:hover, #regexReplaceBtn:hover { background: #e65100; color: white; }         #statusText { color: #2b579a; font-size: 12px; margin-top: 8px; }         #regexResultArea { margin-top: 8px; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }         #regexResultTable { width: 100%; border-collapse: collapse; font-size: 12px; }         #regexResultTable th { background: #2b579a; color: #fff; padding: 5px; text-align: left; font-weight: normal; }         #regexResultTable td { padding: 4px 5px; border-bottom: 1px solid #eee; }         #regexResultTable tbody tr:hover { background: #f0f7ff; cursor: pointer; }         #regexResultTable tbody tr.selected { background: #2b579a !important; color: #fff; }         #regexResultTable tbody tr.replaced { text-decoration: line-through; color: #999; }         .range-radios { font-size: 12px; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px 12px; }         .range-radios label { display: inline-flex; align-items: center; cursor: pointer; white-space: nowrap; }         .range-radios input[type="radio"] { margin-right: 4px; margin-left: 0; vertical-align: middle; }         .regex-shortcuts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }         .regex-shortcuts button { padding: 3px 8px; font-size: 11px; font-family: Consolas, monospace; background: #f5f5f5; border: 1px solid #ccc; color: #333; border-radius: 3px; line-height: 1.6; white-space: nowrap; }         .regex-shortcuts button:hover { background: #2b579a; color: #fff; border-color: #2b579a; }         .quant-popup { display:none; position:absolute; z-index:100; background:#fff; border:1px solid #2b579a; border-radius:4px; padding:8px; box-shadow:0 2px 12px rgba(0,0,0,0.15); font-size:12px; }         .quant-popup input { width:80px !important; padding:4px 6px; margin-bottom:4px; font-size:13px; text-align:center; }         .quant-popup button { font-size:11px; padding:4px 10px; margin-right:4px; cursor:pointer; border-radius:3px; border:1px solid #ccc; background:#f5f5f5; }         .quant-popup button.ok { background:#2b579a; color:#fff; border-color:#2b579a; }         .quant-popup button.cancel { color:#999; }         /* 规则表格 — 类 Excel 网格 */         #ruleTableArea { margin-bottom: 6px; overflow-x: auto; contain: layout style; }         #ruleTable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; contain: layout style; }         #ruleTable th { background: #2b579a; color: #fff; padding: 5px 6px; text-align: left; font-weight: normal; user-select: none; border-bottom: 2px solid #1a3d6b; }         #ruleTable th:first-child { width: 32px; text-align: center; }         #ruleTable th:nth-child(2) { width: 28px; text-align: center; }         #ruleTable th:nth-child(3) { width: 55%; }         #ruleTable th:nth-child(4) { width: 35%; }         #ruleTable th:last-child { width: 28px; text-align: center; }         #ruleTable td { padding: 3px 5px; border: 1px solid #d0d0d0; vertical-align: middle; min-height: 24px; }         /* 序号和删除列不可编辑 */         #ruleTable td.idx-cell { text-align: center; color: #555; font-size: 12px; background: #fafafa; user-select: none; cursor: default; }         #ruleTable td.del-cell { text-align: center; background: #fafafa; user-select: none; }         #ruleTable td.del-cell button { background: none; border: none; color: #999; font-size: 16px; cursor: pointer; padding: 2px 4px; line-height: 1; }         #ruleTable td.del-cell button:hover { color: #e65100; }         /* 可编辑单元格 — 像 Excel 网格 */         #ruleTable td.cell-pattern, #ruleTable td.cell-replace {             background: #fff;             min-width: 80px;             cursor: cell;             line-height: 1.5;             white-space: pre-wrap;             word-break: break-all;         }         #ruleTable td.cell-pattern { font-family: Consolas, 'Courier New', monospace; font-size: 12px; }         #ruleTable td.cell-replace { font-family: Consolas, 'Courier New', monospace; font-size: 12px; color: #333; }         /* 选中状态 — 用 background 而非 outline 避免布局抖动 */         #ruleTable td.selected { background: #2b579a !important; color: #fff !important; }         /* 编辑模式 — 用 inset box-shadow 代替 outline 避免抖动 */         #ruleTable td.editing { box-shadow: inset 0 0 0 2px #e65100; background: #fff; white-space: pre-wrap; word-break: break-all; }         /* 行悬停 */         #ruleTable tbody tr:hover td.cell-pattern,         #ruleTable tbody tr:hover td.cell-replace { background: #f5f8ff; }         /* 工具栏 */         #ruleToolbar { display: flex; gap: 6px; margin-bottom: 4px; align-items: center; flex-wrap: wrap; }         #ruleToolbar button { padding: 3px 10px; font-size: 11px; background: #f5f5f5; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; color: #333; }         #ruleToolbar button:hover { background: #2b579a; color: #fff; border-color: #2b579a; }         #ruleToolbar .hint { color: #999; font-size: 11px; margin-left: 4px; }         #addRuleBtn { padding: 4px 12px; margin-top: 4px; font-size: 12px; background: #f5f5f5; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; color: #2b579a; }         #addRuleBtn:hover { background: #2b579a; color: #fff; border-color: #2b579a; }         /* 导入导出区域 */         #ruleImportExport { display: none; margin-bottom: 6px; }         #ruleImportExport textarea { width: 100%; height: 80px; font-size: 12px; font-family: Consolas, monospace; box-sizing: border-box; }         #ruleImportExport .btn-row { display: flex; gap: 6px; margin-top: 4px; }         #ruleImportExport .btn-row button { padding: 3px 10px; font-size: 11px; background: #f5f5f5; border: 1px solid #ccc; border-radius: 3px; cursor: pointer; }         #ruleImportExport .btn-row button:hover { background: #2b579a; color: #fff; border-color: #2b579a; }     </style> </head> <body>     <p><b>范围设置</b></p>     <div class="range-radios">         <label><input type="radio" name="regexRange" value="all" checked> 全主文档</label>         <label><input type="radio" name="regexRange" value="page"> 当前页面</label>         <label><input type="radio" name="regexRange" value="paragraph"> 当前段落</label>         <label><input type="radio" name="regexRange" value="selection"> 选择区域</label>     </div>      <div class="regex-shortcuts" id="regexShortcuts">         <button data-insert="\d" title="数字">\d</button>         <button data-insert="\D" title="非数字">\D</button>         <button data-insert="\w" title="单词字符(字母/数字/下划线)">\w</button>         <button data-insert="\W" title="非单词字符">\W</button>         <button data-insert="\s" title="空白符(空格/制表/换行)">\s</button>         <button data-insert="\S" title="非空白符">\S</button>         <button data-insert="[\u4e00-\u9fa5]" title="汉字">汉字</button>         <button data-insert="[a-zA-Z]" title="字母">字母</button>         <button data-insert="[0-9a-fA-F]" title="十六进制字符">HEX</button>         <button data-insert="." title="任意字符(不含换行)">.</button>         <button data-insert=".*" title="任意字符0或多次">.*</button>         <button data-insert=".+" title="任意字符1或多次">.+</button>         <button data-insert="^" title="行首">^</button>         <button data-insert="$" title="行尾">$</button>         <button data-insert="\b" title="单词边界">\b</button>         <button data-insert="()" title="捕获组" data-cursor="1">()</button>         <button data-insert="(?!)" title="负向先行断言" data-cursor="3">(?!)</button>         <button data-insert="(?=)" title="正向先行断言" data-cursor="3">(?=)</button>         <span style="width:1px;height:16px;background:#ddd;margin:2px 4px 0;display:inline-block;"></span>         <button data-insert-quant="\d" title="指定数量的数字">d{n}</button>         <button data-insert-quant="\w" title="指定数量的单词字符">w{n}</button>         <button data-insert-quant="." title="指定数量的任意字符">.{n}</button>         <button data-insert-quant="[\u4e00-\u9fa5]" title="指定数量的汉字">汉字{n}</button>         <button data-insert-range="\d" title="数字范围">d{n,m}</button>     </div>      <div class="quant-popup" id="quantPopup">         <div id="quantLabel" style="margin-bottom:4px;color:#555;">数量 n：</div>         <input type="text" id="quantInput" />         <button class="ok" id="quantOk">确定</button>         <button class="cancel" id="quantCancel">取消</button>     </div>      <p><b>规则列表</b> <span style="color:#999;font-size:11px;font-weight:normal;">（像 Excel 一样：鼠标拖动框选，Ctrl+C 复制，Ctrl+V 粘贴）</span></p>     <div id="ruleToolbar">         <span class="hint" id="selInfo"></span>         <button id="copyRulesBtn">复制表格</button>         <button id="pasteRulesBtn">粘贴导入</button>         <button id="exportRulesBtn">导出</button>         <button id="importRulesBtn">导入</button>         <button id="deleteAllRulesBtn" style="color:#e65100;">删除全部</button>     </div>     <div id="ruleTableArea">         <table id="ruleTable">             <thead>                 <tr>                     <th>#</th>                     <th>输入（正则表达式）</th>                     <th>输出（替换为）</th>                     <th></th>                 </tr>             </thead>             <tbody id="ruleBody">             </tbody>         </table>         <button id="addRuleBtn">+ 添加行</button>     </div>      <div id="ruleImportExport">         <textarea id="importExportText" placeholder="粘贴或复制规则（每行：查找文本	替换文本）"></textarea>         <div class="btn-row">             <button id="doImportBtn">确认导入</button>             <button id="doCopyExportBtn">复制为 TSV</button>             <button id="cancelExportBtn">取消</button>         </div>     </div>      <br><br>     <button id="regexFindBtn">查找</button>     <button id="regexReplaceAllBtn">全部替换</button>     <button id="regexReplaceBtn">替换选中</button>     <button id="regexSelectAllBtn">全选</button>     <button id="regexPrevBtn">上一项</button>     <button id="regexNextBtn">下一项</button>      <div id="regexResultArea">         <table id="regexResultTable">             <thead>                 <tr>                     <th style="width:35px;">序号</th>                     <th style="width:40px;">规则#</th>                     <th>匹配内容</th>                     <th>替换预览</th>                 </tr>             </thead>             <tbody id="regexResultBody">                 <tr><td colspan="4" style="padding:15px;text-align:center;color:#999;">请输入正则表达式后点击"查找"</td></tr>             </tbody>         </table>     </div>      <p id="statusText">就绪</p>      <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>     <script>     var statusEl;     var regexState = {         matches: [], currentIndex: -1, isReplaced: [],         patternLines: [], replaceLines: []     };     var saveTimer;      /* ====== 规则表格操作 ====== */         /* ====== 类 Excel 规则网格操作 ====== */     var gridSelection = { active: false, startRow: -1, startCol: -1, endRow: -1, endCol: -1 };          function addRuleRow(pattern, replace) {         var tbody = document.getElementById('ruleBody');         var rowNum = tbody.rows.length + 1;         var tr = document.createElement('tr');          // 用 DocumentFragment 一次性插入，避免逐次 reflow         var frag = document.createDocumentFragment();          var tdIdx = document.createElement('td');         tdIdx.className = 'idx-cell';         tdIdx.textContent = rowNum;          var tdPattern = document.createElement('td');         tdPattern.className = 'cell-pattern';         tdPattern.contentEditable = 'true';         tdPattern.textContent = pattern || '';          var tdReplace = document.createElement('td');         tdReplace.className = 'cell-replace';         tdReplace.contentEditable = 'true';         tdReplace.textContent = replace || '';          var tdDel = document.createElement('td');         tdDel.className = 'del-cell';         var delBtn = document.createElement('button');         delBtn.title = '删除此行';         delBtn.textContent = '×';         delBtn.addEventListener('click', function(e) { e.stopPropagation(); deleteRuleRow(this); });         tdDel.appendChild(delBtn);          tr.appendChild(tdIdx);         tr.appendChild(tdPattern);         tr.appendChild(tdReplace);         tr.appendChild(tdDel);          // 先绑定事件再插入         bindCellEvents(tdPattern);         bindCellEvents(tdReplace);          frag.appendChild(tr);          // 读一次 offsetHeight 触发浏览器缓存当前布局，然后追加 fragment — 避免同步回流         var _dummy = tbody.offsetHeight;         tbody.appendChild(frag);          return tdPattern;     }function bindCellEvents(cell) {         cell.addEventListener('dblclick', function(e) {             lastFocusedCell = this;             enterEditMode(this);         });         cell.addEventListener('focus', function(e) {             lastFocusedCell = this;         });         cell.addEventListener('blur', function(e) {             exitEditMode(this);             autoSave();         });         cell.addEventListener('paste', function(e) {             e.preventDefault();             var text = (e.clipboardData || window.clipboardData).getData('text');             if (!text) return;             if (text.indexOf('\t') >= 0 || text.indexOf('\n') >= 0) {                 pasteGrid(text, this);             } else {                 var sel = window.getSelection();                 if (sel && sel.rangeCount) {                     var range = sel.getRangeAt(0);                     range.deleteContents();                     range.insertNode(document.createTextNode(text));                     range.collapse(false);                 } else {                     this.textContent = text;                 }                 autoSave();             }         });         cell.addEventListener('keydown', function(e) {             if (e.key === 'Tab') {                 e.preventDefault();                 if (e.shiftKey) moveToPrevCell(this);                 else moveToNextCell(this);             } else if (e.key === 'Enter' && !e.shiftKey) {                 e.preventDefault();                 moveToNextCell(this);             } else if (e.key === 'Escape') {                 this.blur();             }         });     }      function initGridSelection() {         var table = document.getElementById('ruleTable');         table.addEventListener('mousedown', function(e) {             var cell = e.target.closest('td.cell-pattern, td.cell-replace');             if (!cell) return;             clearSelection();             var tr = cell.closest('tr');             var tbody = document.getElementById('ruleBody');             var row = Array.prototype.indexOf.call(tbody.rows, tr);             var col = cell.classList.contains('cell-pattern') ? 0 : 1;             if (cell.classList.contains('editing')) return;             gridSelection.active = true;             gridSelection.startRow = gridSelection.endRow = row;             gridSelection.startCol = gridSelection.endCol = col;             cell.classList.add('selected');             updateSelInfo();              function onMove(me) {                 if (!gridSelection.active) return;                 var el = document.elementFromPoint(me.clientX, me.clientY);                 if (!el) return;                 var target = el.closest('td.cell-pattern, td.cell-replace');                 if (!target) return;                 var tTr = target.closest('tr');                 var tRow = Array.prototype.indexOf.call(tbody.rows, tTr);                 var tCol = target.classList.contains('cell-pattern') ? 0 : 1;                 if (tRow === gridSelection.endRow && tCol === gridSelection.endCol) return;                 gridSelection.endRow = tRow;                 gridSelection.endCol = tCol;                 applySelection();                 updateSelInfo();             }             function onUp() {                 gridSelection.active = false;                 document.removeEventListener('mousemove', onMove);                 document.removeEventListener('mouseup', onUp);             }             document.addEventListener('mousemove', onMove);             document.addEventListener('mouseup', onUp);         });     }      function clearSelection() {         var cells = document.querySelectorAll('td.selected');         for (var i = 0; i < cells.length; i++) cells[i].classList.remove('selected');         gridSelection.startRow = gridSelection.startCol = -1;         gridSelection.endRow = gridSelection.endCol = -1;         updateSelInfo();     }      function applySelection() {         var cells = document.querySelectorAll('td.selected');         for (var i = 0; i < cells.length; i++) cells[i].classList.remove('selected');         var tbody = document.getElementById('ruleBody');         var r1 = Math.min(gridSelection.startRow, gridSelection.endRow);         var r2 = Math.max(gridSelection.startRow, gridSelection.endRow);         var c1 = Math.min(gridSelection.startCol, gridSelection.endCol);         var c2 = Math.max(gridSelection.startCol, gridSelection.endCol);         for (var r = r1; r <= r2; r++) {             for (var c = c1; c <= c2; c++) {                 if (r >= 0 && r < tbody.rows.length) {                     var cell = c === 0 ? tbody.rows[r].querySelector('.cell-pattern') : tbody.rows[r].querySelector('.cell-replace');                     if (cell) cell.classList.add('selected');                 }             }         }     }      function updateSelInfo() {         var el = document.getElementById('selInfo');         var count = document.querySelectorAll('td.selected').length;         if (count > 0) {             var r1 = Math.min(gridSelection.startRow, gridSelection.endRow) + 1;             var r2 = Math.max(gridSelection.startRow, gridSelection.endRow) + 1;             el.textContent = '已选 ' + count + ' 格（行 ' + r1 + '-' + r2 + '）';         } else {             el.textContent = '';         }     }      function copySelectedGrid() {         var tbody = document.getElementById('ruleBody');         var selCells = tbody.querySelectorAll('td.selected');         if (selCells.length === 0) {             statusEl.textContent = '请先用鼠标框选要复制的区域';             return;         }         var r1 = Math.min(gridSelection.startRow, gridSelection.endRow);         var r2 = Math.max(gridSelection.startRow, gridSelection.endRow);         var c1 = Math.min(gridSelection.startCol, gridSelection.endCol);         var c2 = Math.max(gridSelection.startCol, gridSelection.endCol);         var lines = [];         for (var r = r1; r <= r2; r++) {             var cells = [];             for (var c = c1; c <= c2; c++) {                 var cell = c === 0 ? tbody.rows[r].querySelector('.cell-pattern') : tbody.rows[r].querySelector('.cell-replace');                 cells.push(cell ? cell.textContent : '');             }             lines.push(cells.join('\t'));         }         copyToClipboard(lines.join('\n'));         statusEl.textContent = '已复制 ' + lines.length + ' 行（可直接粘贴到 Excel）';     }      function pasteGrid(text, targetCell) {         var rows = text.split(/\r?\n/);         var tr = targetCell.closest('tr');         var tbody = document.getElementById('ruleBody');         var startRow = Array.prototype.indexOf.call(tbody.rows, tr);         var startCol = targetCell.classList.contains('cell-pattern') ? 0 : 1;          for (var ri = 0; ri < rows.length; ri++) {             var cols = rows[ri].split('\t');             for (var ci = 0; ci < cols.length; ci++) {                 var r = startRow + ri;                 var c = startCol + ci;                 while (r >= tbody.rows.length) addRuleRow('', '');                 var cell = c % 2 === 0 ? tbody.rows[r].querySelector('.cell-pattern') : tbody.rows[r].querySelector('.cell-replace');                 if (cell) cell.textContent = cols[ci];             }         }         autoSave();         statusEl.textContent = '已粘贴 ' + rows.length + ' 行';     }      function enterEditMode(cell) {         var editing = document.querySelectorAll('td.editing');         for (var i = 0; i < editing.length; i++) editing[i].classList.remove('editing');         clearSelection();         cell.classList.add('editing');         var range = document.createRange();         range.selectNodeContents(cell);         var sel = window.getSelection();         sel.removeAllRanges();         sel.addRange(range);     }      function exitEditMode(cell) {         cell.classList.remove('editing');     }      function moveToNextCell(current) {         var tr = current.closest('tr');         var tbody = document.getElementById('ruleBody');         var rowIdx = Array.prototype.indexOf.call(tbody.rows, tr);         var isPattern = current.classList.contains('cell-pattern');         if (isPattern) {             var replaceCell = tr.querySelector('.cell-replace');             if (replaceCell) { replaceCell.focus(); enterEditMode(replaceCell); return; }         } else if (rowIdx + 1 < tbody.rows.length) {             var nextPattern = tbody.rows[rowIdx + 1].querySelector('.cell-pattern');             if (nextPattern) { nextPattern.focus(); enterEditMode(nextPattern); return; }         }         var inp = addRuleRow('', '');         inp.focus();         enterEditMode(inp);     }      function moveToPrevCell(current) {         var tr = current.closest('tr');         var tbody = document.getElementById('ruleBody');         var rowIdx = Array.prototype.indexOf.call(tbody.rows, tr);         var isReplace = current.classList.contains('cell-replace');         if (isReplace) {             var patternCell = tr.querySelector('.cell-pattern');             if (patternCell) { patternCell.focus(); enterEditMode(patternCell); return; }         } else if (rowIdx > 0) {             var prevReplace = tbody.rows[rowIdx - 1].querySelector('.cell-replace');             if (prevReplace) { prevReplace.focus(); enterEditMode(prevReplace); return; }         }     }          function deleteRuleRow(btn) {         var tr = btn.closest('tr');         var tbody = document.getElementById('ruleBody');         tr.remove();         if (tbody.rows.length === 0) {             addRuleRow('', '');         } else {             renumberRows();         }         autoSave();     }      function copyToClipboard(text) {         var ta = document.createElement('textarea');         ta.value = text;         ta.style.position = 'fixed'; ta.style.opacity = '0';         document.body.appendChild(ta);         ta.select();         navigator.clipboard.writeText(text).catch(function(){ statusEl.textContent = '复制失败'; });         document.body.removeChild(ta);     }      function deleteAllRules() {         var tbody = document.getElementById('ruleBody');         if (tbody.rows.length <= 1 && tbody.rows[0].querySelector('.cell-pattern').textContent.trim() === '') {             statusEl.textContent = '没有规则可删除';             return;         }         // 直接执行，Office 任务窗格中 confirm() 不可靠         while (tbody.rows.length > 0) tbody.deleteRow(0);         addRuleRow('', '');         autoSave();         statusEl.textContent = '已删除全部规则';     }      function copyAllRules() {         var rows = document.getElementById('ruleBody').rows;         if (rows.length === 0) { statusEl.textContent = '没有规则可复制'; return; }         var lines = [];         for (var i = 0; i < rows.length; i++) {             var p = rows[i].querySelector('.cell-pattern').textContent;             if (!p || !p.trim()) continue;             var r = rows[i].querySelector('.cell-replace').textContent;             lines.push(p + '\t' + r);         }         if (lines.length === 0) { statusEl.textContent = '没有带正则的规则可复制'; return; }         copyToClipboard(lines.join('\n'));         statusEl.textContent = '已复制 ' + lines.length + ' 条规则到剪贴板';     }      function pasteFromClipboard() {         // 从剪贴板读取         try {             // 标准 Clipboard API (Async)             navigator.clipboard.readText().then(function(text) {                 doPasteRules(text);             }).catch(function() {                 // 降级：弹出一个文本框让用户手动粘贴                 var area = document.getElementById('ruleImportExport');                 area.style.display = 'block';                 document.getElementById('importExportText').value = '';                 document.getElementById('importExportText').readOnly = false;                 document.getElementById('importExportText').placeholder = '请粘贴规则（每行：查找文本\t替换文本）';                 document.getElementById('doImportBtn').style.display = 'inline-block';                 document.getElementById('doCopyExportBtn').style.display = 'none';                 document.getElementById('cancelExportBtn').style.display = 'inline-block';                 statusEl.textContent = '请粘贴规则到文本框后点击确认导入';             });         } catch(e) {             statusEl.textContent = '读取剪贴板失败，请使用导入按钮';         }     }      function doPasteRules(text) {         if (!text || !text.trim()) { statusEl.textContent = '剪贴板为空'; return; }         var lines = text.split(/[\r\n]+/).filter(function(l){return l.trim()!=='';});         var rules = [];         for (var i = 0; i < lines.length; i++) {             var parts = lines[i].split('\t');             rules.push({pattern: parts[0] || '', replace: parts[1] || ''});         }         if (rules.length === 0) { statusEl.textContent = '未解析到规则'; return; }
